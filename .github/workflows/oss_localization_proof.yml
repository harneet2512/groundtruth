name: "OSS localization proof (full pipeline, 5 langs, parallel)"

on:
  workflow_dispatch:
    inputs:
      gt_substrate_digest:
        description: "Pinned GT substrate digest"
        required: true
        default: ""
      cases_file:
        description: "Cases manifest (relative to benchmarks/data/)"
        required: false
        default: "oss_all60_cases.json"
      repos_file:
        description: "Repos manifest (relative to benchmarks/data/)"
        required: false
        default: "oss_all60_repos.json"

permissions:
  contents: read
  packages: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [python, go, javascript, typescript, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" --password-stdin
      - name: Pull substrate
        run: |
          DIGEST="${{ inputs.gt_substrate_digest }}"
          [ -n "$DIGEST" ] || { echo "::error::no substrate digest"; exit 1; }
          docker pull "$DIGEST"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Clone this language's repos
        env:
          CASES_FILE: ${{ inputs.cases_file }}
          REPOS_FILE: ${{ inputs.repos_file }}
          LANG: ${{ matrix.language }}
        run: |
          mkdir -p /tmp/repos
          python3 -c "
          import json, subprocess, os
          repos = json.load(open('benchmarks/data/' + os.environ['REPOS_FILE']))
          cases = json.load(open('benchmarks/data/' + os.environ['CASES_FILE']))
          lang = os.environ['LANG'].lower()
          needed = {c['repo'] for c in cases if c.get('language','').lower()==lang}
          import shutil
          for name in sorted(needed):
              meta = repos[name]; dst = f'/tmp/repos/{name}'
              # Fast path: shallow init + fetch the exact commit by SHA.
              subprocess.run(['git','init','--quiet',dst], check=False)
              subprocess.run(['git','-C',dst,'remote','add','origin',meta['url']], check=False)
              f = subprocess.run(['git','-C',dst,'fetch','--quiet','--depth','1','origin', meta['commit']], capture_output=True)
              ok = (f.returncode == 0) and (subprocess.run(['git','-C',dst,'checkout','--quiet','FETCH_HEAD'], capture_output=True).returncode == 0)
              if not ok:  # fallback: full clone + checkout
                  shutil.rmtree(dst, ignore_errors=True)
                  subprocess.run(['git','clone','--quiet','--no-checkout', meta['url'], dst], check=False)
                  subprocess.run(['git','-C',dst,'checkout','--quiet', meta['commit']], check=False)
              print(f'cloned {name} @ {meta[\"commit\"][:10]} ({\"shallow\" if ok else \"full\"})', flush=True)
          "
      - name: Run falsifier (RRF reach-drop A/B/C) for this language
        env:
          CASES_FILE: ${{ inputs.cases_file }}
          LANG: ${{ matrix.language }}
        run: |
          mkdir -p /tmp/gt_idx_cache
          # wRRF reach-drop falsifier. BRIEFING §4: reach over-promotes hubs; the RRF
          # gave it a full equal vote (the bug). Proven lever (toy + OSS misses): drop
          # reach's vote so content (sem/lex/path) decides. ONE variable at a time:
          #   control        = current baked fusion (unweighted RRF, reach votes) -> 53/60 ref
          #   reachdrop      = wRRF with GT_RRF_W_REACH=0 (the isolated lever)
          #   reachdrop_sem2 = + GT_RRF_W_SEM=2.0 (does sem-boost add anything on top)
          # Graphs are indexed ONCE (arm 1) then reused from /idx_cache (re-rank only),
          # so 3 arms ~= 1 index cost. No dedup anywhere.
          run_arm () {
            local arm="$1" mode="$2"; shift 2
            local out="/tmp/proof_out/$arm"; mkdir -p "$out"
            echo "::group::ARM=$arm LANG=$LANG (GT_RRF_FUSION='$mode' $*)"
            docker run --rm \
              -v "$GITHUB_WORKSPACE/benchmarks/data/$CASES_FILE:/cases.json:ro" \
              -v "$GITHUB_WORKSPACE/scripts/oss_full_pipeline_proof.py:/proof.py:ro" \
              -v "$GITHUB_WORKSPACE/src/groundtruth:/opt/gt/src/groundtruth:ro" \
              -v "/tmp/repos:/repos:ro" \
              -v "/tmp/gt_idx_cache:/idx_cache" \
              -v "$out:/out" \
              -e GT_FORCE_ONNX_EMBEDDER=1 -e GT_REQUIRE_EMBEDDER=1 \
              -e GT_REQUIRE_LSP=1 -e GT_REQUIRE_FTS5=1 \
              -e GT_INDEX_BIN=gt-index -e GT_SRC=/opt/gt/src \
              -e GT_INDEX_CACHE=/idx_cache \
              -e GT_PROOF_LANG="$LANG" \
              -e GT_RRF_FUSION="$mode" \
              "$@" \
              "$DIGEST" \
              python /proof.py /cases.json /repos /out || echo "::warning::arm $arm ($LANG) failed"
            echo "::endgroup::"
          }
          # Comprehensive cheap-lever falsifier, ONE variable per arm, all correctly
          # wired to the DELIVERED brief (harness deliv_rank = gold_rank over the
          # delivered localization_proof, so each lever's effect is measured):
          #   control     = baseline (current 53/60 ref)
          #   wpathdecay  = C: localize W_PATH_DECAY 0.30->0.15 (the @1 lever; BRIEFING §3 #2)
          #   recallfilter= R1: drop vendored/minified bundles at the delivered seam (tutanota)
          #   bm25depth   = R2: BM25 recall admit 10->50 (recall depth; ~free)
          #   combined    = C+R1+R2 together
          # (run_v74 reach-drop / wRRF is the candidate-window lever, measured in the
          #  prior run 28351851187 — weak for @1 per the integration audit, so not re-run here.)
          # Track-2 EMBEDDER A/B (needs the jina-baked substrate digest). control = gte
          # (current default); jina = swap to the code embedder; jina_deepK = + deepen the
          # dense seed (so a better embedder isn't wasted behind top-10); jina_r1 = + bundle
          # filter (recall hygiene). The embedder changes the SEED (recall) + cosine (ranking)
          # — the only lever expected to GENERALIZE (cheap C/R1/R2 were net-zero @1).
          # Embedder × FUSION matrix. The @1 gap is a FUSION problem (RRF discards the
          # embedder's cosine MAGNITUDE — measured: golds lose by 1e-4..5e-3, express lost
          # with perfect lex+path). So we must test jina under BOTH fusions:
          #   *_rrf  = GT_RRF_FUSION=on  (rank fusion — magnitude discarded)
          #   *_lin  = GT_RRF_FUSION=off (linear _total_score — magnitude PRESERVED; v7.4
          #            adapts W_SEM up on nl_gap so the embedder margin actually counts)
          # Diagnosis test: if jina lifts @1 under LIN but not RRF -> the bottleneck is the
          # FUSION ALGORITHM, not the embedder. control = current default (gte + RRF).
          # SEMANTIC-DOMINANT, WHOLE-PIPELINE-ACTIVATED hypothesis (user directive):
          # give the embedder (understands code+meaning) dominant power, magnitude-preserved
          # (linear fusion, NOT RRF), in BOTH stages — run_v74 (GT_SEM_DOMINANT) AND localize
          # (GT_LOC_SEM_LED, semantic magnitude leads entries[0]) — with the code embedder (jina)
          # + deepened seed. Isolation:
          #   control       = gte + RRF (current default)
          #   jina_rrf      = jina under RRF (recall lift expected; @1 ~flat — magnitude discarded)
          #   gte_semdom    = gte + semantic-dominant magnitude fusion (does the ALGORITHM fix help @1?)
          #   jina_semdom   = jina + semantic-dominant magnitude fusion (THE hypothesis)
          #   jina_semdom_r1= + recall path/bundle filter
          JINA=jinaai/jina-embeddings-v2-base-code
          run_arm control       on
          run_arm jina_rrf      on  -e GT_EMBED_MODEL_NAME="$JINA" -e GT_EMBED_DIM=768 -e GT_SEM_TOP_K=30
          run_arm gte_semdom    off -e GT_SEM_DOMINANT=1 -e GT_LOC_SEM_LED=1
          run_arm jina_semdom   off -e GT_EMBED_MODEL_NAME="$JINA" -e GT_EMBED_DIM=768 -e GT_SEM_TOP_K=30 -e GT_SEM_DOMINANT=1 -e GT_LOC_SEM_LED=1
          run_arm jina_semdom_r1 off -e GT_EMBED_MODEL_NAME="$JINA" -e GT_EMBED_DIM=768 -e GT_SEM_TOP_K=30 -e GT_SEM_DOMINANT=1 -e GT_LOC_SEM_LED=1 -e GT_RECALL_PATHCLASS_FILTER=1
      - name: Show this language's result
        if: always()
        run: |
          python3 -c "
          import json, os
          for a in ['control','jina_rrf','gte_semdom','jina_semdom','jina_semdom_r1']:
              p=f'/tmp/proof_out/{a}/SUMMARY.json'
              if not os.path.exists(p): print(a,'MISSING'); continue
              d=json.load(open(p)); n=d['total_cases']
              print(f'{a}: @1={d[\"gold_at_1\"]}/{n} in8={d[\"gold_in_8\"]}/{n} diag_clean={d.get(\"diagnostic_clean\")}/{n} viol={d.get(\"violation_counts\",{})}')
              for k,v in sorted(d.get('by_regime',{}).items()):
                  print(f'    {k}: @1={v[\"at_1\"]}/{v[\"n\"]} in8={v[\"in_8\"]}/{v[\"n\"]} miss={v[\"miss\"]}')
          "
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-proof-${{ matrix.language }}
          path: /tmp/proof_out/
