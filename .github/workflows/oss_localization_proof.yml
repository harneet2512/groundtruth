name: "OSS localization proof (full pipeline, 5 langs)"

on:
  workflow_dispatch:
    inputs:
      gt_substrate_digest:
        description: "Pinned GT substrate digest"
        required: true
        default: ""
      cases_file:
        description: "Cases manifest (relative to benchmarks/data/)"
        required: false
        default: "oss_localization_cases.json"
      repos_file:
        description: "Repos manifest (relative to benchmarks/data/)"
        required: false
        default: "oss_repos.json"

permissions:
  contents: read
  packages: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" --password-stdin
      - name: Pull substrate
        run: |
          DIGEST="${{ inputs.gt_substrate_digest }}"
          [ -n "$DIGEST" ] || { echo "::error::no substrate digest"; exit 1; }
          docker pull "$DIGEST"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Clone OSS repos at pinned commits
        env:
          CASES_FILE: ${{ inputs.cases_file }}
          REPOS_FILE: ${{ inputs.repos_file }}
        run: |
          mkdir -p /tmp/repos
          python3 -c "
          import json, subprocess, os
          repos = json.load(open('benchmarks/data/' + os.environ['REPOS_FILE']))
          cases = json.load(open('benchmarks/data/' + os.environ['CASES_FILE']))
          needed = {c['repo'] for c in cases}
          for name in sorted(needed):
              meta = repos[name]
              dst = f'/tmp/repos/{name}'
              subprocess.run(['git','clone','--quiet','--no-checkout', meta['url'], dst], check=True)
              subprocess.run(['git','-C',dst,'checkout','--quiet', meta['commit']], check=True)
              print(f'cloned {name} @ {meta[\"commit\"][:10]}')
          "
      - name: Run localization pipeline + diagnostic (default fusion)
        env:
          CASES_FILE: ${{ inputs.cases_file }}
        run: |
          mkdir -p /tmp/proof_out
          # Mount the checkout's Python over the baked code so the proof tests
          # HEAD (the IDF path fix lands after the substrate was built). gt-index
          # binary + ONNX model + LSP servers stay baked.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/benchmarks/data/$CASES_FILE:/cases.json:ro" \
            -v "$GITHUB_WORKSPACE/scripts/oss_full_pipeline_proof.py:/proof.py:ro" \
            -v "$GITHUB_WORKSPACE/src/groundtruth:/opt/gt/src/groundtruth:ro" \
            -v "/tmp/repos:/repos:ro" \
            -v "/tmp/proof_out:/out" \
            -e GT_FORCE_ONNX_EMBEDDER=1 -e GT_REQUIRE_EMBEDDER=1 \
            -e GT_REQUIRE_LSP=1 -e GT_REQUIRE_FTS5=1 \
            -e GT_INDEX_BIN=gt-index \
            -e GT_SRC=/opt/gt/src \
            "$DIGEST" \
            python /proof.py /cases.json /repos /out
      - name: Show summary + diagnostic
        if: always()
        run: |
          python3 -c "
          import json
          d = json.load(open('/tmp/proof_out/SUMMARY.json'))
          n = d['total_cases']
          print('=== LOCALIZATION RESULT ===')
          print(f'gold_at_1: {d[\"gold_at_1\"]}/{n}   gold_in_8: {d[\"gold_in_8\"]}/{n}   rendered_at_1: {d.get(\"rendered_at_1\",0)}/{n}')
          print('=== DIAGNOSTIC (fail-closed gate) ===')
          print(f'diagnostic_clean: {d.get(\"diagnostic_clean\",0)}/{n}')
          print(f'violation_counts: {d.get(\"violation_counts\",{})}')
          print('=== per language ===')
          for k,v in sorted(d['by_language'].items()):
              print(f'  {k}: @1={v[\"at_1\"]}/{v[\"n\"]} in8={v[\"in_8\"]}/{v[\"n\"]} miss={v[\"miss\"]} sem_zero={v[\"sem_zero\"]}')
          print('=== by scale ===')
          for k,v in sorted(d.get('by_scale',{}).items()):
              print(f'  {k}: @1={v[\"at_1\"]}/{v[\"n\"]} in8={v[\"in_8\"]}/{v[\"n\"]} miss={v[\"miss\"]}')
          "
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-localization-proof
          path: /tmp/proof_out/
