name: "DeepSWE: Full benchmark (parallel matrix)"

# Runs the WHOLE DeepSWE benchmark in parallel — one task per job, fanned across
# max-parallel runners — instead of the single-task deepswe_trial. Each job is the
# EXACT legitimate per-task flow from deepswe_trial: pull the task image, index the
# base-commit repo FRESH in-container, run the shipped LSP resolve pass, HARD-gate
# the full stack, then run the 300-step GT mini-swe-agent and collect the trajectory.
#
# Legitimacy: no preindex artifacts, no prebuilt graph reuse — every task indexes its
# own repo live (GT_FORBID_PREBUILT_GRAPH=1). Full-stack gates abort a degraded task
# before it spends. Use deepswe_trial for single-task debugging; this for the benchmark.
#
# Parallel-account scaling: a mirror on a second GitHub account runs this concurrently
# on its own runner pool. Both accounts read ONE shared public cache via the assets_repo
# input (default harneet2512/groundtruth) — the GHCR task images + the pipeline-assets-v1
# model release — so neither re-mirrors and the LFS quota is never touched.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "LLM model"
        required: true
        default: "deepseek/deepseek-v4-flash"
      language:
        description: "Language filter (all, python, go, typescript, javascript, rust)"
        required: true
        default: "all"
      max_tasks:
        description: "Max tasks to run (0 = all 113). max_tasks=1 + max_parallel=1 = the 1-task demo."
        required: true
        default: "0"
      instance_ids:
        description: "Explicit comma-separated instance IDs (overrides language/max_tasks; validated against the 113-task manifest — e.g. one id for a precise 1-task demo)"
        required: false
        default: ""
      max_parallel:
        description: "Concurrent jobs. Default 20 — DeepSeek API is NOT the bound (confirmed not rate-limited at 20; litellm num_retries=3 absorbs any transient 429s). Use 1 for the demo, lower if your GHA account runner ceiling is below 20."
        required: true
        default: "20"
      step_limit:
        description: "Agent step budget (DeepSWE-official = 300). Use 5 for a FAST OOM/swap diagnostic; 300 for the real run. Overrides the GT_STEP_LIMIT env default."
        required: false
        default: "300"
      eval_cpus:
        description: "CPUs for the eval container (--override-cpus). 2 = demand-shrink to fit 16GB on heavy builds (non-degrading, only slows verification). 4 = full (baseline, for the no-degradation A/B). Overrides GT_EVAL_CONTAINER_CPUS."
        required: false
        default: "2"
      eval_livecap_mb:
        description: "If set (e.g. 8000), live `docker update --memory=<MB>m --memory-swap=-1` the eval container the instant it starts — last-lever OOM test for the heavy giants. Empty = off."
        required: false
        default: ""
      assets_repo:
        description: "owner/repo that hosts the shared GHCR image cache + pipeline-assets-v1 release (a mirror on another account points here so both share ONE public cache)"
        required: true
        default: "harneet2512/groundtruth"
      gt_substrate_digest:
        description: "Pinned GT substrate image by IMMUTABLE digest (ghcr.io/<org>/gt-substrate@sha256:<digest>). Overrides vars.GT_SUBSTRATE_DIGEST. Proof input — never a mutable tag."
        required: false
        default: ""
      require_pinned_substrate:
        description: "Fail-closed if no pinned digest is set (1 = enforce the substrate-consume proof path; 0 = transitional warn-and-skip). Default 1 per the handoff hard rule."
        required: true
        default: "1"
      proactive_topn:
        description: "GT_PROACTIVE_TOPN — front-load compact contract/callers for the top-N [INFO]-dropped brief candidates. 1 = OFF (byte-identical default / A-B OFF arm); 4 = ON. Baked code path — takes effect ONLY on a substrate rebuilt with the change."
        required: false
        default: "1"
      verify_structural_risk:
        description: "GT_VERIFY_STRUCTURAL_RISK — at VERIFY, surface blast-radius caller-tests for a structural edit (Q3 consumption lever, gt_mini_patch). 0 = OFF (default; arm only after the per-method FP profile is known). 1 = ON."
        required: false
        default: "0"
      edit_check:
        description: "GT_EDIT_CHECK — E: at-edit SYNTAX validation. Run the repo's OWN parse-only toolchain on a just-edited source file; deliver the compiler's native diagnostic on a parse break (SWE-agent linter-guard parity). '' = unset (default; profile-controllable — GT_RL_PROFILE can activate it; downstream ${:-0} = OFF, byte-identical). '0' = explicit per-flag OFF (overrides the profile). 1 = ON."
        required: false
        default: ""
      post_search_native:
        description: "GT_POST_SEARCH_NATIVE — FORMAT A/B B-arm: render post_search def-facts as native ripgrep-style output (no <gt-*> tag) instead of the tagged block. Same content, different format. 0 = OFF (default; tagged, byte-identical). 1 = ON (native)."
        required: false
        default: "0"
      gateway:
        description: "GT_GATEWAY — W2 single-surface completer: ONE gateway.augment() call per tool observation, arbitrated to <=1 deterministic FACT, appended byte-preserving into the same observation (TITO). '' = unset (default; profile-controllable — GT_RL_PROFILE can activate it; downstream ${:-0} = OFF, byte-identical). '0' = explicit per-flag OFF (overrides the profile). 1 = ON."
        required: false
        default: ""
      gt_arm:
        description: "Paired-run arm: gt enables GT; baseline sets GT_BASELINE=1 and does not require substrate proof."
        required: false
        default: "gt"
      depth_flags:
        description: "Depth+DCC master switch (2026-07 build). 0 = OFF (byte-identical: all six new flags off in code). 1 = ON = GT_NEG_EVIDENCE·GT_TYPEFLOW_FIXPOINT·GT_FIELD_CANDIDATES·GT_SEM_BODY·GT_PASSAGE_WIDE (index/brief, via substrate -e) + GT_DCC (agent, via --ae). REQUIRES a substrate baked on THIS run's commit (commit-parity)."
        required: false
        default: "0"
      content_leg:
        description: "Stratum-B content-BM25 leg (GT_CONTENT_LEG), independent of depth_flags. 1 = ON (default): the localizer's BM25-over-symbol-BODY-content surface (symbol_content_fts) fills the lexical slot ONLY when live-grep recalled nothing (behavior-described / stratum-B / graph-only tasks). Mutually exclusive with grep -> byte-identical on symbol-anchored (stratum-A) tasks = non-regressive by construction; test symbols excluded at source (leak=0). No rebake needed (symbol_content_fts is already baked; the flag is query-time). 0 = OFF."
        required: false
        default: "1"
      obligations_v2:
        description: "GT_OBLIGATIONS_V2 — obligation coverage + exercised-clause checklist (EARS/RFC-2119 extractor, dynamic budget, T2 workspace checklist, T3 submit-time unexercised detector). 0 = OFF (default; byte-identical). 1 = ON. REQUIRES a substrate baked on THIS run's commit (the extractor runs inside gt-run-proof)."
        required: false
        default: "0"
      cooperative_flags:
        description: "Cooperative-localization channels, independent of depth_flags. 1 = ON = GT_POST_SEARCH (agent answers its OWN repo-wide grep of a bare symbol with def-site + verified-caller facts, in-band, via --ae) + GT_CONSENSUS_LEDGER (the <gt-localization> HIGH head renders 'N/3 signals agree' + receipts instead of the imperative 'Edit target:', via substrate -e + --ae; ranking-invariant, form-only). Both correct-or-quiet + leak-0 by construction. 0 = OFF (default; byte-identical)."
        required: false
        default: "0"
      rl_profile:
        description: "GT_RL_PROFILE — ONE versioned toggle for the coherent RL-adherence stack (B-16/B-17). 1 = ON activates GT_GATEWAY·GT_GATEWAY_NATIVE·GT_STEER_NATIVE·GT_LANE_ENVELOPE·GT_EDIT_CHECK·GT_VERIFY_EXECUTE·GT_D7_RELATEDNESS·GT_OBLIGATION_FRESHNESS (fanned out in gt_ae_block.sh via rl_profile.py). An EXPLICITLY-set member input still overrides the profile (per-flag control). Harness ABORTS before model spend if a requested member capability is unavailable (fail-closed). '' = OFF (default; byte-identical — no member flag changed). Measurement-only authority stays advisory."
        required: false
        default: ""
      new_delivery_levers:
        description: "WS-1/2/3/4/5 delivery levers (GT_DOSE_ROTATE+GT_SS_FLARE+GT_RECOVERY_LOOP+GT_L6_FRESH_GATE+GT_CHANGE_SURFACE_COCHANGE+GT_REPRO_SYNTH — NOT multidose). '1' = all ON for the delivery witness; '0' = OFF (byte-identical)."
        required: false
        default: "0"
      enable_multidose:
        description: "GT_MULTIDOSE — >1 dose/observation. SEPARATE from new_delivery_levers because it violates the <=1-dose proof invariant (dose_lte_one). '1' only for a dedicated multidose experiment, never the standard witness. Default '0'."
        required: false
        default: "0"
      audit_broadenings:
        description: "2026-07-24 17-feature audit trigger-broadenings (GT_EDIT_CHECK_NAMES undefined-name + GT_SIG_CALLER_FALLBACK caller grep-fallback + GT_SUBMIT_VERIFY unverified-submit). '1' = ON to witness the broadened triggers; '0' = OFF (byte-identical). Needs a substrate REBUILT on this commit (GT_EDIT_CHECK_NAMES is baked in src/edit_check.py)."
        required: false
        default: "0"
      require_commit_parity:
        description: "Strict commit-parity gate (github.sha == substrate baked commit). '1' (default) = full-run strict. '0' = allow a CI-ONLY-delta validation to run an EXISTING substrate whose baked commit lags the checkout by pipeline/gate fixes only (the GT product code that runs is the substrate's, not the checkout's) — used to validate a gate fix without a rebake."
        required: false
        default: "1"

permissions:
  contents: write   # live-log bridge force-pushes per-task logs to gha-live-logs/<task> branches
  packages: read

env:
  # Defensive UTF-8 (infra): hard-pin utf-8 so a stray runner locale can't reintroduce the
  # cp1252 git/rg-subprocess decode crash (the code fix in src/groundtruth already guards it);
  # PYTHONUTF8 also covers pier's braille-spinner encode.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  # Full-stack enforcement (same as deepswe_trial) — no silent fallback on a paid run.
  # MASTER gate: GT_REQUIRE_FULL_STACK=1 implies require-embedder/lsp/fts5 in
  # preflight_pipeline.py; the explicit per-dimension flags are kept for belt-and-braces.
  GT_REQUIRE_FULL_STACK: "1"
  GT_REQUIRE_FULL_POTENTIAL: "1"
  GT_REQUIRE_FTS5: "1"
  GT_FORCE_ONNX_EMBEDDER: "1"
  GT_REQUIRE_EMBEDDER: "1"
  GT_REQUIRE_LSP: "1"
  # PRODUCT RULE: NEVER refuse a task for GT-quality reasons. A thin/broken graph means GT has
  # LESS to offer (correct-or-quiet) — the agent still has the full real repo + self-localizes, so
  # we run BEST-EFFORT. The graph_certificate verdict is still RECORDED (telemetry / honest
  # attribution: we know it was thin, we just don't refuse the task). DISARMED (=0): the cert is
  # informational, never a gate. element-web etc. RUN, not skipped.
  GT_REQUIRE_GRAPH_VALID: "0"
  # Blocker 2: a substrate whose BAKED build-commit != this run's checkout commit ABORTS
  # (stale-bake guard). Makes Blocker 1 self-enforcing: a forgotten rebuild fails closed
  # instead of silently running old localizer/depth code.
  GT_REQUIRE_COMMIT_PARITY: ${{ github.event.inputs.require_commit_parity || '1' }}
  # H8 DISARMED (best-effort rule): GT_REQUIRE_PARSE_RATE would log.Fatalf the indexer on a low
  # fractional parse rate (main.go:241), THROWING AWAY the partial graph it could produce — that
  # refuses GT help on a hard repo. Under "never refuse / best of effort" we keep whatever partial
  # graph parses. The parse-failure LOGGING (Parsed X/Y + failSample) + the 0-parse DETECTION
  # (main.go:234, unconditional) stay — that is the detect/log/identify hardening, not a refusal.
  GT_RRF_FUSION: "on"   # brief fusion parity with Pro: RRF (bias-free) + exact-path floor (53/60)
  GT_LOC_FUSION_V2: "1"        # BAKED: independent-surface RRF localizer (generalizing: OSS-60 +2, held-out +1, 0 regression)
  GT_LOC_BEHAVIOR_LEAD: "0"    # BAKED: behavior-gate OFF (it suppressed the held-out lift)
  # PROACTIVE top-N brief front-load (v1r_brief.render_brief). 1 = OFF (byte-identical
  # baked default); >1 front-loads compact contract/callers for the top-N [INFO]-dropped
  # candidates. BAKED code path — active only on a substrate rebuilt with the change; the
  # A/B toggles OFF(1)/ON(4) via the proactive_topn dispatch input on ONE rebuilt image.
  GT_PROACTIVE_TOPN: ${{ github.event.inputs.proactive_topn || '1' }}
  # Q3 consumption lever (synced agent path; gt_mini_patch reads it). Default 0 = OFF
  # (byte-identical current behavior). Forwarded to the agent container via --ae below.
  GT_VERIFY_STRUCTURAL_RISK: ${{ github.event.inputs.verify_structural_risk || '0' }}
  # ── B-16/B-17 official RL profile — ONE versioned toggle. When set (e.g. '1') the
  # gt_ae_block.sh fan-out (rl_profile.py) activates the coherent member set below
  # UNLESS a member is EXPLICITLY set (per-flag control still wins); it also ABORTS
  # before model spend if a requested member capability is unavailable (fail-closed).
  # '' = OFF (default): the fan-out is a strict no-op → byte-identical to today.
  GT_RL_PROFILE: ${{ github.event.inputs.rl_profile || '' }}
  # 2026-07-23 WS-1/2/3/4/5 DELIVERY LEVERS (gt_mini_patch + src/groundtruth) — all 7 keyed off ONE
  # input (new_delivery_levers), forwarded to the container via gt_ae_block.sh. Default '0' =>
  # byte-identical. '1' = all ON for the delivery witness.
  GT_DOSE_ROTATE: ${{ github.event.inputs.new_delivery_levers || '0' }}
  GT_SS_FLARE: ${{ github.event.inputs.new_delivery_levers || '0' }}
  GT_RECOVERY_LOOP: ${{ github.event.inputs.new_delivery_levers || '0' }}
  GT_L6_FRESH_GATE: ${{ github.event.inputs.new_delivery_levers || '0' }}
  # GT_MULTIDOSE is DECOUPLED from new_delivery_levers on purpose: it delivers >1 dose per
  # observation, which violates the <=1-dose PROOF invariant (ss_proof_manifest dose_lte_one) the
  # whole proof chain assumes -> it would record a ≤1-dose violation + pollute the witness. Keep it
  # OFF for the standard delivery witness; its own input arms it only for a dedicated multidose run.
  GT_MULTIDOSE: ${{ github.event.inputs.enable_multidose || '0' }}
  GT_CHANGE_SURFACE_COCHANGE: ${{ github.event.inputs.new_delivery_levers || '0' }}
  GT_REPRO_SYNTH: ${{ github.event.inputs.new_delivery_levers || '0' }}
  # 2026-07-24 17-feature audit trigger-broadenings (keyed off audit_broadenings; default 0 = byte-identical)
  GT_EDIT_CHECK_NAMES: ${{ github.event.inputs.audit_broadenings || '0' }}
  GT_SIG_CALLER_FALLBACK: ${{ github.event.inputs.audit_broadenings || '0' }}
  GT_SUBMIT_VERIFY: ${{ github.event.inputs.audit_broadenings || '0' }}
  # E — at-edit syntax validation (synced agent path; gt_mini_patch reads it). RL-profile
  # member: input default is '' (unset), passed RAW — NOT `|| ''` (Brief-F5): the input's
  # own default of '0' is a NON-empty (truthy) string, so `|| ''` forwarded '0' on a UI
  # dispatch → the resolver read it as an explicit OFF override and the profile could
  # NEVER activate edit_check from the UI. Raw passthrough keeps ''=unset (profile
  # activates) and '0'=explicit per-flag OFF distinguishable. Downstream ${GT_EDIT_CHECK:-0}
  # yields '0' when empty → byte-identical off. Forwarded to the agent container via --ae.
  GT_EDIT_CHECK: ${{ github.event.inputs.edit_check }}
  # FORMAT A/B B-arm (synced agent path; gt_mini_patch reads it). Default 0 = OFF
  # (tagged post_search, byte-identical). Forwarded to the agent container via --ae below.
  GT_POST_SEARCH_NATIVE: ${{ github.event.inputs.post_search_native || '0' }}
  # W2 master flag (synced agent path; gt_mini_patch reads it). Default 0 = OFF
  # (byte-identical). Forwarded to the agent container via --ae below.
  # NOTE (CONFIRMED-1): GT_GATEWAY and GT_POST_SEARCH (below) are forwarded
  # INDEPENDENTLY; when BOTH are 1 the in-code dose-law guard makes SEARCH turns
  # post_search-WINS — the Gateway is skipped for search events (the lattice owns the
  # single dose + the single shared probe record). The Gateway stays live for
  # edit/test turns. See gt_mini_patch._gateway_search_excluded.
  # RL-profile member: input default is '' (unset), passed RAW — NOT `|| ''` (Brief-F5,
  # same ABI fix as GT_EDIT_CHECK above): the input's own '0' default is a truthy string
  # so `|| ''` forwarded '0' → explicit-OFF override → the profile could never activate
  # gateway from a UI dispatch. Raw passthrough keeps ''=unset (profile activates) vs
  # '0'=explicit per-flag OFF distinguishable. Downstream ${GT_GATEWAY:-0} yields '0' when
  # empty → byte-identical off (only functional refs: this def + the --ae ${GT_GATEWAY:-0}).
  GT_GATEWAY: ${{ github.event.inputs.gateway }}
  # ── Depth+DCC mechanisms (2026-07 build) — master switch `depth_flags` (default 0 = OFF =
  # byte-identical; all six read default-off in code). The 5 index/brief flags cross the substrate
  # boundary via explicit `-e` in scripts/ci/substrate_proof.sh (each GT_* is projected into
  # gt-index AND the brief-gen subprocess by clean_env_projection's GT_ allowlist); GT_DCC crosses
  # to the agent via `--ae` below. All six are ALSO forwarded via --ae so the L6-fresh post-edit
  # reindex + any agent-side localization match the substrate's resolver/parser/passage settings.
  GT_NEG_EVIDENCE: ${{ inputs.depth_flags == '1' && '1' || '0' }}
  GT_TYPEFLOW_FIXPOINT: ${{ inputs.depth_flags == '1' && '1' || '0' }}
  GT_FIELD_CANDIDATES: ${{ inputs.depth_flags == '1' && '1' || '0' }}
  GT_SEM_BODY: ${{ inputs.depth_flags == '1' && '1' || '0' }}
  GT_PASSAGE_WIDE: ${{ inputs.depth_flags == '1' && '1' || '0' }}
  GT_DCC: ${{ inputs.depth_flags == '1' && '1' || '0' }}
  # Stratum-B content-BM25 leg — SEPARATE from depth_flags, ON by default (non-regressive:
  # fires only when live-grep recalled nothing; byte-identical on stratum-A). Query-time flag
  # projected into the substrate brief-gen (-e) + agent runtime (--ae); no rebake needed.
  GT_CONTENT_LEG: ${{ inputs.content_leg == '0' && '0' || '1' }}
  # Cooperative-localization channels (master `cooperative_flags`, default 0 = OFF = byte-identical).
  # GT_POST_SEARCH is agent-side (gt_mini_patch) — already forwarded via --ae below; GT_CONSENSUS_LEDGER
  # is brief-side (v1r_brief) — projected into the substrate brief-gen via -e (substrate_proof.sh) AND
  # via --ae for the agent-side L6-fresh brief regen. Both default-off in code; ON only when set here.
  GT_POST_SEARCH: ${{ inputs.cooperative_flags == '1' && '1' || '0' }}
  GT_CONSENSUS_LEDGER: ${{ inputs.cooperative_flags == '1' && '1' || '0' }}
  # GT_OBLIGATIONS_V2 (2026-07-08 build): brief-side extractor flag — projected
  # into gt-run-proof via substrate_proof.sh -e; runtime T3 is ARTIFACT-WINS
  # (activates on gt_obligations_v2.json presence, no env needed in-container).
  GT_OBLIGATIONS_V2: ${{ inputs.obligations_v2 == '1' && '1' || '0' }}
  GT_BASELINE: ${{ inputs.gt_arm == 'baseline' && '1' || '0' }}
  # Legitimacy: the per-task graph must be built FRESH from THIS task's repo — never a
  # cross-run / stale / out-of-repo prebuilt graph.db. In substrate-consume mode the graph
  # the substrate emits to /gt_artifacts FROM the mounted /work:ro IS that fresh per-task
  # graph (built inside the pinned image, this task, this commit); the adapter consumes it
  # read-only. This flag forbids a STALE/cross-run injection, not the legitimate substrate
  # handoff (proof.py HOST_HANDOFF; same reconciliation as the OH wrapper freshness check).
  GT_FORBID_PREBUILT_GRAPH: "1"
  # HF must be fully offline: the embedder + dataset come from the baked model / local
  # files only. Any HF network read on a paid run is a degraded-stack signal -> fail.
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  # ── SUBSTRATE-CONSUME (handoff §A/§B-AFTER/§D/§G) ───────────────────────────
  # The GT proof runtime is a PINNED, portable substrate image (Option B). It is
  # referenced by IMMUTABLE DIGEST, never a mutable tag (§F.1). gt-run-proof runs
  # INSIDE that image with the task repo mounted /work:ro and emits the 8 artifacts
  # (incl. brief.txt) to /gt_artifacts; the DeepSWE adapter CONSUMES them read-only
  # and NEVER rebuilds.
  GT_SUBSTRATE_DIGEST: ${{ inputs.gt_substrate_digest || vars.GT_SUBSTRATE_DIGEST }}
  # Fail-closed digest pin (§E GT_SUBSTRATE_DIGEST_MISSING / PROOF_RUNTIME_FALLBACK_FORBIDDEN):
  # with this =1 a run with no pinned digest ABORTS (no host fallback, no per-task provisioning).
  GT_REQUIRE_PINNED_SUBSTRATE: ${{ inputs.require_pinned_substrate }}
  # Gates policy (P1-f decision: STRICT proof default). gt-run-proof's foundational gates
  # ARE the proof contract on this pipeline — deliver-always there converts a gate failure
  # into a green zero-run (the P0.1 chain), and unlike the OH live-agent workflows there is
  # no separate agent-path consumer of this flag here (it is not forwarded via --ae). So the
  # proof container is strict by DEFAULT ("0"); deliver-always is an EXPLICIT opt-in (set
  # this to "1" deliberately). The OH workflows keep their own explicit "1" (agent path).
  GT_GATES_DELIVER_ALWAYS: "0"
  # Proof env for the AGENT path (hook validation in-container): the adapter consumes the
  # substrate certs and validates the in-container graph reads against the resolved graph.
  GT_PROOF_MODE: "1"
  GT_CONTAINERIZED: "1"
  GT_RUNTIME_STRATEGY: "unified_substrate"
  # Optional GLOBAL override of the per-language LSP readiness budget (seconds). Empty =
  # use the per-language default chosen in the proof step (go/rust=5s no-op floor,
  # ts/js/python=20s). vars.* indirection only — never a secret, never a hardcoded value.
  GT_LSP_READY_BUDGET_S_OVERRIDE: ${{ vars.GT_LSP_READY_BUDGET_S_OVERRIDE }}
  # ── VERIFICATION HORIZON (self-verification gate) ────────────────────────────
  # Budget-aware self-verification: GT proactively reminds the agent to test
  # before shipping. GT_STEP_LIMIT reads the pier config's step_limit (300 for
  # DeepSWE). GT_SELF_VERIFY_ATTEMPTS is the post-exit outer safety ring (the
  # retry loop, product name for GT_RETRY_ON_VERIFIER_FAIL). V is the estimated
  # cost (in steps) of one edit->test->edit cycle, railed to [8, 40].
  GT_STEP_LIMIT: ${{ inputs.step_limit || '300' }}
  GT_EVAL_CONTAINER_CPUS: ${{ inputs.eval_cpus || '2' }}
  GT_EVAL_CONTAINER_LIVECAP_MB: ${{ inputs.eval_livecap_mb || '' }}
  # PARITY R0 (2026-07-08): 0 = official single-attempt semantics (leaderboard = stock
  # mini-swe-agent, ONE run, no verifier-feedback loop). The 3-attempt retry ring is a GT
  # harness feature — enable (>0) ONLY in experiments never compared to the leaderboard.
  GT_SELF_VERIFY_ATTEMPTS: "0"
  GT_VERIFICATION_CYCLE_COST: "25"
  # Model API keys are set ONLY inside the per-model routing branch (Run GT trial
  # step), never at top-level — a top-level key pollutes every model path and causes
  # pier's provider detection to concatenate competing keys.

jobs:
  # ── Stage-0 / prepare: ENV-ONLY. Leaderboard legitimacy. ────────────────────
  # This job builds the TASK MATRIX from the bench clone (dataset metadata) and
  # NOTHING ELSE. It must NOT build graph.db for any benchmark task repo — per-task
  # graphs are built FRESH, in-container, in the `trial` job (GT_FORBID_PREBUILT_GRAPH=1).
  # A prebuilt / cross-job graph would be benchmark-shape leakage. The guard below
  # asserts no graph.db was produced here.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total: ${{ steps.gen.outputs.total }}
      bench_sha: ${{ steps.bench_clone.outputs.bench_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workflow lint — catch CI bug classes before the paid matrix
        shell: bash
        run: |
          # Fail-fast in cheap Stage-0: a bash-ism-under-sh, bare-pip, unguarded
          # dataset fetch, or a swallowed required-op in either official workflow
          # aborts HERE instead of sliding into the paid trial matrix.
          python scripts/verify/workflow_lint.py \
            .github/workflows/deepswe_full.yml \
            .github/actions/setup-eval/action.yml

      - name: Digest precheck (fail-closed at run level — abort BEFORE the paid matrix)
        shell: bash
        run: |
          # Mirrors deepswe_proof_sweep.yml/verified_run.yml: a missing/mutable digest
          # must kill the run HERE (one cheap job), not 113 times inside the matrix.
          # Respects the require_pinned_substrate transitional escape hatch (=0).
          if [ -z "${GT_SUBSTRATE_DIGEST:-}" ]; then
            if [ "${GT_REQUIRE_PINNED_SUBSTRATE:-1}" = "1" ]; then
              echo "GT_SUBSTRATE_DIGEST_MISSING: no pinned substrate digest (gt_substrate_digest" | tee -a trial_output.log
              echo "input or vars.GT_SUBSTRATE_DIGEST). NOTE: harneet2512/groundtruth has NO repo"
              echo "vars — dispatches there MUST pass the gt_substrate_digest input explicitly."
              exit 1
            fi
            echo "::warning::GT_SUBSTRATE_DIGEST unset + GT_REQUIRE_PINNED_SUBSTRATE=0 (transitional) — per-task steps will skip the substrate proof"
            exit 0
          fi
          case "$GT_SUBSTRATE_DIGEST" in
            *@sha256:*) echo "pinned substrate OK: $GT_SUBSTRATE_DIGEST" ;;
            *) echo "GT_SUBSTRATE_DIGEST_MISSING: '$GT_SUBSTRATE_DIGEST' is not an immutable @sha256 digest (mutable tags are not a valid proof input)" | tee -a trial_output.log; exit 1 ;;
          esac

      - name: Cost guard — per-task step_limit + cost_limit MUST be set (no unlimited spend)
        shell: bash
        run: |
          # The per-task spend bounds live in the pier agent config (consumed via
          # --ak config_file=...): agent.step_limit (DeepSWE official = 300) and
          # agent.cost_limit (USD). A config without BOTH finite positive bounds
          # means an unbounded paid matrix — abort in Stage-0. Stdlib regex (no
          # pyyaml dependency in the cheap job); the keys are flat scalars.
          GT_PIER_CFG=artifact_deepswe/gt_integration/deepswe_gt_pier.yaml python3 << 'PYEOF'
          import os, re, sys
          cfg = os.environ["GT_PIER_CFG"]
          txt = open(cfg, encoding="utf-8").read()
          sl = re.search(r"^\s*step_limit:\s*([0-9]+)\s*$", txt, re.M)
          cl = re.search(r"^\s*cost_limit:\s*([0-9.]+)\s*$", txt, re.M)
          # DeepSWE uses step_limit=0 (unlimited) + cost_limit=$3 as the bound.
          # step_limit=0 is valid (means unlimited, cost_limit is the real cap).
          if not cl or float(cl.group(1)) <= 0:
              sys.exit(f"FATAL: agent.cost_limit missing/zero in {cfg} — unbounded cost forbidden")
          sl_val = int(sl.group(1)) if sl else 0
          print(f"cost guard OK: step_limit={sl_val} ({'unlimited' if sl_val==0 else sl_val}) "
                f"cost_limit=${cl.group(1)} USD per task")
          PYEOF
      - name: Clone deepswe-bench
        id: bench_clone
        run: |
          if [ ! -d "deepswe-bench" ]; then
            git clone --depth 1 --branch v1.0.0 https://github.com/datacurve-ai/deep-swe.git deepswe-bench
          fi
          # Run provenance: record WHICH deepswe-bench commit defined this run's task set
          # (a --depth 1 clone of the default branch can drift between runs). Surfaced in
          # the run summary (summarize job) + uploaded per-task (run_provenance.json).
          BENCH_SHA=$(git -C deepswe-bench rev-parse HEAD 2>/dev/null || true)
          echo "bench_sha=${BENCH_SHA}" >> "$GITHUB_OUTPUT"
          echo "deepswe-bench clone SHA: ${BENCH_SHA:-<unknown>}"
          # PARITY: hard-verify the checkout is EXACTLY tag v1.0.0 (COMMIT c33fa70e;
          # 79a508a9 is the annotated tag OBJECT). Abort before any task otherwise.
          DESC=$(git -C deepswe-bench describe --tags --exact-match 2>/dev/null || true)
          [ "$DESC" = "v1.0.0" ] || { echo "FATAL: deepswe-bench not tag v1.0.0 (describe='$DESC' sha=$BENCH_SHA)"; exit 1; }
          case "$BENCH_SHA" in c33fa70e*) : ;; *) echo "FATAL: deepswe-bench HEAD $BENCH_SHA != v1.0.0 commit c33fa70e..."; exit 1 ;; esac
          ! grep -Rqs "Since v1.1" deepswe-bench/README.md 2>/dev/null || { echo "FATAL: deepswe-bench README says Since v1.1 (v1.1 grader)"; exit 1; }
          echo "deepswe-bench v1.0.0 grading path VERIFIED"

      # ── SPEED-OPT A: cache deepswe-bench across runs (keyed on commit SHA) ──
      # The bench repo is cloned in every matrix job (113×) for task validation and
      # pier's task dir. After the clone above, archive it ONCE here in prepare so each
      # trial job restores the tarball from cache (fast local decompress) instead of
      # git-cloning over the network.
      - name: Cache deepswe-bench clone (bench_sha-keyed, archive for matrix jobs)
        shell: bash
        run: |
          BENCH_SHA="${{ steps.bench_clone.outputs.bench_sha }}"
          BENCH_CACHE_KEY="deepswe-bench-clone-${BENCH_SHA:-unknown}"
          echo "BENCH_CACHE_KEY=${BENCH_CACHE_KEY}" >> "$GITHUB_ENV"
          # Write the key out so the actions/cache step below can reference it.
          echo "bench_cache_key=${BENCH_CACHE_KEY}" >> "$GITHUB_OUTPUT"
          # Archive the clone so actions/cache can store it.
          tar -czf /tmp/deepswe-bench.tar.gz deepswe-bench/
          echo "deepswe-bench archived: $(du -sh /tmp/deepswe-bench.tar.gz | cut -f1)"
        id: bench_archive

      - name: Save deepswe-bench tarball to GHA cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/deepswe-bench.tar.gz
          key: ${{ steps.bench_archive.outputs.bench_cache_key }}

      # ── SPEED-OPT B: pre-build harness venv ONCE in prepare → restore per job ──
      # pier + GT python package install runs per job even with the wheel cache
      # (pip resolver + egg-link scan costs 20-60s each). Build a fully-installed
      # venv here, tar it to a fixed path, cache with pyproject-hash key, and
      # restore + activate in each trial job — pip never runs in the hot path.
      - name: Build and cache harness venv (pier==0.2.0 + GT editable install)
        shell: bash
        run: |
          set -e
          VENV_DIR=/tmp/gt-harness-venv
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python -m pip install --upgrade pip --quiet
          python -m pip install "datacurve-pier==0.2.0" --quiet
          python -m pip install -e . --quiet
          deactivate
          tar -czf /tmp/gt-harness-venv.tar.gz -C /tmp gt-harness-venv/
          echo "harness venv archived: $(du -sh /tmp/gt-harness-venv.tar.gz | cut -f1)"

      - name: Save harness venv to GHA cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/gt-harness-venv.tar.gz
          key: gt-harness-venv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-pier020

      # ── SPEED-OPT C: pull + save substrate image ONCE → restore per job ──────
      # The ~8GB substrate is pulled from GHCR in every matrix job (113×). Save it
      # ONCE here (docker save | gzip → cache) so each trial job loads from cache
      # instead of pulling from the network. The GHA cache cap is 10GB total; a
      # docker save of the substrate (compressed) is typically 2-5GB. If the save
      # would exceed the cap (10GB limit), the cache/save step will silently fail-
      # to-save and each job falls back to the direct GHCR pull — graceful degradation.
      # Key is the immutable @sha256 digest so a substrate update automatically busts.
      - name: Pull + save substrate image for matrix job cache
        shell: bash
        if: ${{ env.GT_SUBSTRATE_DIGEST != '' }}
        run: |
          set -e
          # Install docker CLI so prepare can pull + save the substrate.
          if ! command -v docker >/dev/null 2>&1; then
            DVER=27.3.1
            curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DVER}.tgz" -o /tmp/docker.tgz \
              && tar -xzf /tmp/docker.tgz -C /tmp \
              && cp /tmp/docker/docker /usr/local/bin/docker \
              && chmod +x /usr/local/bin/docker
          fi
          # GHCR login so prepare can pull from the authenticated registry.
          OWNER=$(echo "${{ inputs.assets_repo }}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$OWNER" --password-stdin
          echo "pulling substrate: $GT_SUBSTRATE_DIGEST"
          if docker pull "$GT_SUBSTRATE_DIGEST"; then
            echo "saving substrate image to /tmp/gt-substrate.tar.gz ..."
            docker save "$GT_SUBSTRATE_DIGEST" | gzip -1 > /tmp/gt-substrate.tar.gz
            SAVED_SIZE=$(du -sh /tmp/gt-substrate.tar.gz | cut -f1)
            echo "substrate image saved: $SAVED_SIZE"
            # Extract the digest fingerprint (sha256 hex, no colon prefix) for the cache key.
            DIGEST_HEX=$(echo "$GT_SUBSTRATE_DIGEST" | sed 's/.*@sha256://')
            echo "SUBSTRATE_CACHE_KEY=gt-substrate-img-${DIGEST_HEX:0:16}" >> "$GITHUB_ENV"
            echo "substrate_cache_key=gt-substrate-img-${DIGEST_HEX:0:16}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::substrate pull in prepare failed — each trial job will pull directly from GHCR"
            echo "SUBSTRATE_CACHE_KEY=" >> "$GITHUB_ENV"
            echo "substrate_cache_key=" >> "$GITHUB_OUTPUT"
          fi
        id: substrate_save
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Save substrate image tarball to GHA cache
        if: ${{ steps.substrate_save.outputs.substrate_cache_key != '' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/gt-substrate.tar.gz
          key: ${{ steps.substrate_save.outputs.substrate_cache_key }}

      # ── SPEED-OPT D: pull + save static docker CLI + compose binaries once ───
      # Each trial job downloads docker CLI (~50MB) + compose plugin (~30MB) when
      # absent. Cache the two binaries keyed on version so the per-job install is
      # a cache restore + cp instead of a curl download.
      - name: Fetch + cache static docker CLI and compose plugin
        shell: bash
        run: |
          DVER=27.3.1
          CVER=2.29.7
          DOCKER_BIN=/tmp/docker-cli-cache/docker
          COMPOSE_BIN=/tmp/docker-cli-cache/docker-compose
          mkdir -p /tmp/docker-cli-cache
          if [ ! -x "$DOCKER_BIN" ]; then
            curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DVER}.tgz" -o /tmp/docker.tgz \
              && tar -xzf /tmp/docker.tgz -C /tmp/docker-cli-cache --strip-components=1 docker/docker \
              && chmod +x "$DOCKER_BIN"
          fi
          if [ ! -x "$COMPOSE_BIN" ]; then
            curl -fsSL "https://github.com/docker/compose/releases/download/v${CVER}/docker-compose-linux-x86_64" \
              -o "$COMPOSE_BIN" && chmod +x "$COMPOSE_BIN"
          fi
          echo "docker CLI: $(${DOCKER_BIN} --version 2>&1 | head -1)"
          echo "compose: $($COMPOSE_BIN version 2>&1 | head -1)"

      - name: Save docker CLI + compose binaries to GHA cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-cli-cache
          key: docker-cli-27.3.1-compose-2.29.7-linux-x86_64

      - id: gen
        name: Build task matrix (manifest-driven; clone cross-checked — run-set == cache-set)
        env:
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_MAX_TASKS: ${{ inputs.max_tasks }}
          INPUT_INSTANCE_IDS: ${{ inputs.instance_ids }}
        run: |
          # SOURCE OF TRUTH: artifact_deepswe/repo_manifest.json (the version-controlled
          # 113-task set — the SAME file cache_deepswe_images.yml mirrors from, so the
          # run-set and the GHCR cache-set can never drift apart). The deep-swe clone is
          # CROSS-CHECKED per selected task (dir + task.toml exist, docker_image matches
          # the manifest) so a bench-repo drift fails HERE, deterministically, instead of
          # surfacing as a mid-matrix pull/validate failure. Selection order is the
          # manifest order (stable across runs) — never the clone's glob order.
          python3 << 'PYEOF'
          import json, os, sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          lang = os.environ.get("INPUT_LANGUAGE", "all")
          maxt = int(os.environ.get("INPUT_MAX_TASKS", "0") or "0")
          explicit = [t.strip() for t in os.environ.get("INPUT_INSTANCE_IDS", "").split(",") if t.strip()]
          with open("artifact_deepswe/repo_manifest.json", encoding="utf-8") as f:
              man = json.load(f)
          tasks = man.get("tasks") or []
          if not tasks:
              sys.exit("FATAL: repo_manifest.json has no tasks")
          for t in tasks:
              for k in ("instance_id", "language", "docker_image"):
                  if not t.get(k):
                      sys.exit(f"FATAL: manifest entry missing {k!r}: {t}")
          by_id = {t["instance_id"]: t for t in tasks}
          if explicit:
              unknown = [t for t in explicit if t not in by_id]
              if unknown:
                  sys.exit(f"FATAL: unknown instance ids (not in the 113-task manifest): {unknown}")
              sel = [by_id[t] for t in explicit]
          else:
              sel = [t for t in tasks if lang == "all" or t["language"] == lang]
              if maxt > 0:
                  sel = sel[:maxt]
          # GHA matrix cap is 256; DeepSWE is 113, but guard anyway (fail-closed, never
          # truncate — a truncated run looks complete and corrupts the denominator).
          if len(sel) > 256:
              sys.exit(f"FATAL: {len(sel)} selected tasks exceed the 256 GHA matrix cap")
          # Cross-check every SELECTED task against the bench clone (the dir pier runs).
          drift = []
          for t in sel:
              tid = t["instance_id"]
              toml_path = os.path.join("deepswe-bench", "tasks", tid, "task.toml")
              if not os.path.isfile(toml_path):
                  drift.append(f"{tid}: task dir/task.toml missing in the deep-swe clone")
                  continue
              try:
                  with open(toml_path, "rb") as fh:
                      tt = tomllib.load(fh)
              except Exception as e:
                  drift.append(f"{tid}: task.toml unparseable ({e})")
                  continue
              clone_img = (tt.get("environment", {}) or {}).get("docker_image", "")
              if clone_img != t["docker_image"]:
                  drift.append(f"{tid}: image drift manifest={t['docker_image']} clone={clone_img}")
          if drift:
              print("FATAL: RUN_SET_DRIFT — manifest vs deep-swe clone mismatch "
                    "(refresh repo_manifest.json + re-run cache_deepswe_images.yml):", file=sys.stderr)
              for d in drift:
                  print(f"  {d}", file=sys.stderr)
              sys.exit(1)
          include = [{"task": t["instance_id"], "language": t["language"],
                      "image": t["docker_image"]} for t in sel]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
              f.write(f"total={len(include)}\n")
          langs = {}
          for t in sel:
              langs[t["language"]] = langs.get(t["language"], 0) + 1
          print(f"{len(include)} tasks queued (lang={lang}, max={maxt}, "
                f"explicit={len(explicit)}) langs={langs}", file=sys.stderr)
          PYEOF

      - name: Legitimacy guard — Stage-0 built NO task graph.db (env-only)
        run: |
          # Fail-closed: if any graph.db materialized in this env-only job, a per-task
          # graph leaked into prepare -> reject (would be benchmark-shape preindexing).
          FOUND=$(find "$GITHUB_WORKSPACE" -name 'graph.db' 2>/dev/null | head -5)
          if [ -n "$FOUND" ]; then
            echo "FATAL: prepare/Stage-0 produced graph.db — must be env/metadata only:"
            echo "$FOUND"
            exit 1
          fi
          echo "legitimacy OK: no graph.db built in Stage-0 (per-task graphs are fresh in-container)"

  trial:
    needs: prepare
    runs-on: ubuntu-latest
    name: "${{ matrix.task }} (${{ matrix.language }})"
    # The REAL agent budget is step_limit=300 + cost_limit=$3.0 (enforced by the cost guard) —
    # NOT a wall-clock cut. The job timeout is only a runaway backstop, set near GHA's 360-min
    # max so a legitimately long run (300 steps on a giant, slowed by the overlay2 OOM throttle,
    # + the 5-15 min pull/proof prologue) is NEVER killed as a time-out. A time cut that ends a
    # clean run is a false failure (the goreleaser class); the step cap bounds the agent, time
    # does not. (Per user directive: remove the time cuts, keep the 300-step cap.)
    timeout-minutes: 350
    # The container's default shell is sh/dash; our steps use bash-isms (PIPESTATUS,
    # ${!...}). Pin the whole job to bash so fail-closed guards evaluate correctly
    # (the "Bad substitution" / "declare -A" crashes were sh running bash syntax).
    defaults:
      run:
        shell: bash
    # BARE runner (NO container:). pier runs the task env + verifier as sibling containers
    # on the runner's OWN docker, so bind-mount sources resolve on the host — fixing the
    # "bind source path does not exist: .../verifier" that the in-container setup hit (the
    # container saw /__w but the host has /home/runner/work, so sibling containers couldn't
    # find the in-container paths). Bare ubuntu HAS g++/docker/compose/git-lfs; we install
    # pier + go toolchain + gopls + onnxruntime here (the image used to bake them).
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
    env:
      TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
    steps:
      - name: Checkout GroundTruth
        uses: actions/checkout@v4
        with:
          lfs: false  # LFS QUOTA EXHAUSTED (2026-06-05): the e5 model is fetched from the
                      # pipeline-assets-v1 RELEASE ASSET below (release bandwidth is separate
                      # and unmetered — NOT LFS). lfs:true here now fails the whole job
                      # ("failed to fetch some objects"), as it did on the Live path.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight checks (fail-fast on infra, warn on quality)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -e
          echo "=== INFRA PREFLIGHT (fail-fast) ==="
          INPUT_MODEL="${{ inputs.model }}"
          if echo "$INPUT_MODEL" | grep -qiE "openrouter/|xiaomi/mimo"; then
            [ "${#OPENROUTER_API_KEY}" -gt 10 ] || { echo "::error::OPENROUTER_API_KEY missing"; exit 1; }
            echo "  OPENROUTER_API_KEY present (${#OPENROUTER_API_KEY} chars)"
          elif echo "$INPUT_MODEL" | grep -qiE "deepseek"; then
            [ "${#DEEPSEEK_API_KEY}" -gt 10 ] || { echo "::error::DEEPSEEK_API_KEY missing"; exit 1; }
            echo "  DEEPSEEK_API_KEY present (${#DEEPSEEK_API_KEY} chars)"
          else
            echo "  model=$INPUT_MODEL — no key check (provider auto-detected by pier)"
          fi
          # 2. Docker CLI (required for substrate pull + pier + task images)
          docker --version || { echo "::error::docker CLI not available (will be installed below — this is a pre-check)"; true; }
          echo "  Docker CLI pre-check done"
          # 3. Disk space (need >= 10GB for substrate + task image + artifacts)
          FREE_GB=$(df --output=avail / | tail -1 | awk '{printf "%.0f", $1/1048576}')
          [ "$FREE_GB" -ge 10 ] || { echo "::error::Low disk: ${FREE_GB}GB free (need >=10GB for substrate + task images + artifacts)"; exit 1; }
          echo "  Disk: ${FREE_GB}GB free"
          # 4. Network / GHCR reachable (warning only — Docker Hub fallback exists)
          curl -sf --max-time 10 https://ghcr.io/v2/ -o /dev/null || echo "::warning::GHCR not reachable — Docker Hub fallback will be used"
          echo "  Network check done"
          # 5. Substrate digest format (when provided — hard format check before any pull attempt)
          if [ -n "${GT_SUBSTRATE_DIGEST:-}" ]; then
            echo "$GT_SUBSTRATE_DIGEST" | grep -qE '^.+@sha256:[a-f0-9]{64}$' || { echo "::error::GT_SUBSTRATE_DIGEST malformed: $GT_SUBSTRATE_DIGEST"; exit 1; }
            echo "  Substrate digest format valid"
          fi
          # 6. GT source syntax (key Python modules — catches bad merges before paid matrix)
          python -c "import ast; ast.parse(open('src/groundtruth/mcp/tools.py').read()); print('  GT mcp/tools.py syntax OK')" || echo "::warning::GT mcp/tools.py syntax check failed"
          python -c "import ast; ast.parse(open('src/groundtruth/mcp/server.py').read()); print('  GT mcp/server.py syntax OK')" || echo "::warning::GT mcp/server.py syntax check failed"
          echo "=== PREFLIGHT PASS ==="

      # ── TOOLCHAIN CACHE (scalability) ──────────────────────────────────────────
      # SPEED-OPT B restore: harness venv built ONCE in prepare (pier==0.2.0 + GT
      # editable install). Restore the tarball here → unpack → activate. Falls back
      # to a direct pip install if the cache miss (e.g. first run or pyproject change).
      - name: Restore harness venv from cache
        id: venv_cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/gt-harness-venv.tar.gz
          key: gt-harness-venv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-pier020

      - name: Install host harness deps (pier + GT python deps for the adapter ONLY — NO host LSP)
        run: |
          set -e
          # SUBSTRATE-CONSUME (handoff §B-AFTER + §F.2 "no host GT execution"): LSP/gates/graph
          # build all run INSIDE the pinned substrate. The runner therefore installs ONLY what
          # the HARNESS needs: pier (to run the agent) and the GT python deps the ADAPTER imports
          # host-side (GTRuntimeContext / proof.graph_edges_hash for the §H witness, and the brief
          # fallback). NO gopls/rust-analyzer/tsserver/pyright on the runner — host LSP is exactly
          # the §B BEFORE/invalid host-split this change removes.
          #
          # SPEED-OPT B: if the venv tarball was restored from cache, unpack + activate it
          # instead of running pip (saves 20-60s per job on the hot path).
          if [ -f /tmp/gt-harness-venv.tar.gz ]; then
            echo "venv cache HIT — unpacking harness venv"
            tar -xzf /tmp/gt-harness-venv.tar.gz -C /tmp/
            # Relink the editable install to THIS checkout (the venv was built in prepare
            # against a different GITHUB_WORKSPACE path; update the .pth / egg-link so
            # the adapter imports from the current checkout, not the prepare workspace).
            VENV_SITE=$(/tmp/gt-harness-venv/bin/python -c "import site; print(site.getsitepackages()[0])")
            # Remove stale groundtruth egg-link/direct_url pointing to prepare workspace.
            find "$VENV_SITE" -name "groundtruth*.egg-link" -delete 2>/dev/null || true
            find "$VENV_SITE" -name "__editable__.groundtruth*.pth" -delete 2>/dev/null || true
            # Re-install just the GT package editable (no-deps, wheel already present → fast).
            /tmp/gt-harness-venv/bin/python -m pip install -e . --no-deps --quiet 2>&1 | tail -3 || true
            # Activate: prepend venv bin so pier + python resolve here.
            echo "PATH=/tmp/gt-harness-venv/bin:$PATH" >> "$GITHUB_ENV"
            echo "VIRTUAL_ENV=/tmp/gt-harness-venv" >> "$GITHUB_ENV"
            export PATH="/tmp/gt-harness-venv/bin:$PATH"
            command -v pier >/dev/null || { echo "FATAL: pier not on PATH after venv restore"; exit 1; }
            echo "host harness ready (venv cache): pier=$(command -v pier)"
          else
            echo "venv cache MISS — installing harness from scratch (first run / pyproject changed)"
            python -m pip install --upgrade pip
            # PINNED: the whole --ae/--mounts-json env+mount integration was source-verified
            # against pier 0.2.0 (cli/jobs.py:620,629 -> factory extra_env -> DockerEnvironment
            # exec -e). An unpinned install lets an upstream release silently change that
            # plumbing mid-run — never float the harness contract on a paid matrix.
            python -m pip install "datacurve-pier==0.2.0" || { echo "FATAL: pier install failed"; exit 1; }
            command -v pier >/dev/null || { echo "FATAL: pier not on PATH after install"; exit 1; }
            echo "host harness ready: pier=$(command -v pier) (LSP/gates/graph run inside the substrate)"
          fi

      - name: Trust the workspace for git (CI checkout uid mismatch)
        run: |
          git config --global --add safe.directory '*' || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Mark job-start epoch (legitimacy freshness baseline)
        run: |
          # Any GT artifact (graph.db, brief, closure) with an mtime BEFORE this is
          # carried over from an earlier run and is illegitimate. The legitimacy
          # guard uses GT_JOB_STARTED as the fresh-build cut-off.
          echo "GT_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify env armed (fail-closed — abort before any paid work)
        shell: bash
        run: |
          set -e
          # Each var MUST be present and == 1. A missing/overridden flag silently
          # re-enables a degraded fallback -> fail immediately. POSIX-safe (no bash
          # arrays) AND pinned to bash so it runs under sh-default container jobs too.
          BAD=0
          for k in GT_REQUIRE_FTS5 GT_REQUIRE_EMBEDDER GT_FORCE_ONNX_EMBEDDER \
                   GT_REQUIRE_LSP GT_REQUIRE_FULL_STACK GT_FORBID_PREBUILT_GRAPH \
                   HF_DATASETS_OFFLINE TRANSFORMERS_OFFLINE HF_HUB_OFFLINE; do
            v=$(printenv "$k" || true)
            if [ "$v" = "1" ]; then echo "  $k=1 OK"; else echo "FATAL: env $k='$v' expected '1' — fail-closed gate"; BAD=1; fi
          done
          [ "$BAD" -eq 0 ] || { echo "FATAL: fail-closed env not armed"; exit 1; }
          echo "=== fail-closed env ARMED ==="

      # ── SPEED-OPT D restore: docker CLI + compose from cache ────────────────────
      - name: Restore docker CLI + compose binaries from cache
        id: docker_cli_cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-cli-cache
          key: docker-cli-27.3.1-compose-2.29.7-linux-x86_64

      - name: Install docker CLI (socket is mounted, CLI binary not baked)
        run: |
          # The container mounts /var/run/docker.sock but the baked image lacks the
          # docker CLI -> "Unable to locate executable file: docker" on GHCR login +
          # pier --env docker. Install the client best-effort.
          # docker CLI is REQUIRED (GHCR login + pier --env docker + task image pulls).
          # A true absence must fail the job — never run degraded.
          # SPEED-OPT D: use cached binaries from prepare when available (avoids curl download).
          if ! command -v docker >/dev/null; then
            if [ -x /tmp/docker-cli-cache/docker ]; then
              echo "docker CLI from cache"
              cp /tmp/docker-cli-cache/docker /usr/local/bin/docker
              chmod +x /usr/local/bin/docker
            else
              echo "docker CLI absent and no cache — fetching static client binary"
              DVER=27.3.1
              curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DVER}.tgz" -o /tmp/docker.tgz \
                && tar -xzf /tmp/docker.tgz -C /tmp \
                && cp /tmp/docker/docker /usr/local/bin/docker \
                && chmod +x /usr/local/bin/docker \
                || (apt-get update -qq && apt-get install -y -qq docker.io) \
                || { echo "FATAL: docker CLI missing and static+apt install failed"; exit 1; }
            fi
          fi
          docker --version 2>&1 | head -1 || { echo "FATAL: docker CLI still missing"; exit 1; }
          # pier uses `docker compose` (v2 plugin) — the static client + docker.io DON'T
          # include it ("unknown flag: --project-name" => compose subcommand absent).
          # Install the compose v2 plugin binary into the CLI-plugins dir.
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p /usr/local/lib/docker/cli-plugins
            if [ -x /tmp/docker-cli-cache/docker-compose ]; then
              echo "compose plugin from cache"
              cp /tmp/docker-cli-cache/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            else
              echo "compose plugin absent and no cache — fetching"
              curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose \
                && chmod +x /usr/local/lib/docker/cli-plugins/docker-compose \
                || { echo "FATAL: docker compose plugin install failed"; exit 1; }
            fi
          fi
          docker compose version 2>&1 | head -1 || { echo "FATAL: docker compose still missing"; exit 1; }

      - name: Install current GT host-side (adapter imports ONLY — no gt-index build, no host LSP)
        run: |
          set -e
          # The graph build / FTS5 / LSP / closure / embedder / gates all run INSIDE the pinned
          # substrate (handoff §F.2/§F.3/§F.4 — no host GT execution, no per-task pip into the
          # task image, no host gt-index build). Host-side we install ONLY the current checkout's
          # GT so the DeepSWE adapter can import groundtruth.runtime (GTRuntimeContext +
          # proof.graph_edges_hash) for the §H witness and the brief fallback.
          # SPEED-OPT B: if the venv was restored, the -e install already ran in harness setup
          # above (re-linked to this workspace). Skip if already importable.
          if python -c "import groundtruth.runtime.proof, groundtruth.runtime.context" 2>/dev/null; then
            echo "GT runtime already importable (venv cache active) — no install needed"
          else
            python -m pip install -e .
          fi
          # PYTHONPATH: THIS checkout's src (current adapter/runtime code, not any baked snapshot)
          # + scripts/swebench + scripts/metrics (so the canonical graph_certificate.format_graph_witness
          # the adapter MAY call is importable host-side; the adapter also self-adds it to sys.path).
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/swebench:$GITHUB_WORKSPACE/scripts/metrics" >> "$GITHUB_ENV"
          python -c "import groundtruth.runtime.proof as p, groundtruth.runtime.context as c; print('GT runtime importable host-side:', bool(p.graph_edges_hash and c.GTRuntimeContext))"

      - name: Log in to GHCR for the shared image cache (token-aware, cross-account)
        env:
          # On a MIRROR account, GHCR_PULL_TOKEN = the assets_repo owner's packages token
          # (read:packages) so we pull their PRIVATE shared cache without making it public
          # (no API exists to flip user-package visibility). On the OWNER account the secret
          # is absent -> fall back to the job's own GITHUB_TOKEN (reads its own packages).
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER=$(echo "${{ inputs.assets_repo }}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          echo "GHCR login OK as $OWNER (cache: ghcr.io/$OWNER/swe-bench-202605)"

      # ── SPEED-OPT A restore: deepswe-bench from cache ────────────────────────────
      - name: Restore deepswe-bench from cache
        id: bench_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/deepswe-bench.tar.gz
          key: deepswe-bench-clone-${{ needs.prepare.outputs.bench_sha }}

      - name: Clone deepswe-bench (or restore from cache)
        run: |
          if [ -f /tmp/deepswe-bench.tar.gz ] && [ ! -d "deepswe-bench" ]; then
            echo "bench cache HIT — unpacking deepswe-bench from cache"
            tar -xzf /tmp/deepswe-bench.tar.gz
          fi
          if [ ! -d "deepswe-bench" ]; then
            echo "bench cache MISS — cloning deepswe-bench from GitHub"
            git clone --depth 1 --branch v1.0.0 https://github.com/datacurve-ai/deep-swe.git deepswe-bench
          fi
          # Run provenance: record what SHA this task actually ran from. On a cache hit
          # this equals prepare's bench_sha (same tarball); on a cache miss it is the
          # live clone SHA (document any drift).
          BENCH_SHA=$(git -C deepswe-bench rev-parse HEAD 2>/dev/null || true)
          echo "GT_DEEPSWE_BENCH_SHA=${BENCH_SHA}" >> "$GITHUB_ENV"
          echo "deepswe-bench clone/cache SHA: ${BENCH_SHA:-<unknown>}"

      - name: Validate task exists
        run: |
          TASK_DIR="deepswe-bench/tasks/${{ matrix.task }}"
          if [ ! -d "$TASK_DIR" ]; then
            echo "::error::Task directory not found: $TASK_DIR"; exit 1
          fi
          echo "Task directory: $TASK_DIR"

      # ── SPEED-OPT C restore: substrate image from GHA cache ──────────────────
      # Restore the tarball saved in prepare (docker save | gzip). If the cache hit,
      # docker load below is ~10-30s vs a cold GHCR pull (~3-8 min). The cache key is
      # the first 16 hex chars of the @sha256 digest so a new substrate automatically
      # busts the cache. GHA cache max is 10GB total — substrate compressed is ~2-5GB;
      # if the save failed in prepare (exceeded cap) the restore will miss and the job
      # falls back to the regular GHCR pull without failing.
      # NOTE: the cache key must be computed at step-time since GT_SUBSTRATE_DIGEST is
      # set as a top-level env var (not an input expression); we derive it in a small
      # bash step first and then pass it to cache/restore via an output + env write.
      - name: Compute substrate cache key
        id: substrate_cache_key
        shell: bash
        run: |
          DIGEST_HEX=$(echo "${GT_SUBSTRATE_DIGEST:-}" | sed 's/.*@sha256://')
          if [ -n "$DIGEST_HEX" ]; then
            KEY="gt-substrate-img-${DIGEST_HEX:0:16}"
          else
            KEY="gt-substrate-img-none"
          fi
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore substrate image tarball from cache
        id: substrate_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/gt-substrate.tar.gz
          key: ${{ steps.substrate_cache_key.outputs.key }}

      - name: Configure docker overlay2 + low-mem extraction (OOM fix — before any image load)
        shell: bash
        run: |
          # [OOM FIX #6+#4, ZERO-DEGRADATION] Force the legacy overlay2 graphdriver + constrain dockerd
          # ONCE here, BEFORE the substrate proof docker-loads the substrate or pier pulls the task image.
          # Docker 29's containerd image store unpacks ALL layers before cleanup (~15GB anon RSS); overlay2
          # unpacks layer-by-layer WITH cleanup (peak ~12GB). MemoryHigh=11G THROTTLES dockerd (not kill);
          # GOMEMLIMIT + vm.dirty_bytes bound its heap + force writeback. Doing it HERE (not mid-trial)
          # means NO docker restart between the proof writing /tmp/gt and the trial mounting it — the
          # mid-trial restart was breaking the GT mount (GT_ARTIFACT_MISSING). Byte-identical extract.
          echo '{"storage-driver":"overlay2","features":{"containerd-snapshotter":false},"max-concurrent-downloads":3}' | sudo tee /etc/docker/daemon.json >/dev/null 2>&1 || true
          sudo mkdir -p /etc/systemd/system/docker.service.d 2>/dev/null || true
          # GOMEMLIMIT=10GiB + MemoryHigh=11G: REVERTED from 4GiB/8G. The 4GiB clamp was a SELF-INFLICTED
          # env-start REGRESSION — dockerd's working set is ~5.8GB, so GOMEMLIMIT=4GiB forces constant GC
          # thrash and dockerd can't start the eval container -> EnvironmentStartTimeoutError. Proven by
          # bisection: GOMEMLIMIT=10GiB ran 4/6 giants; 4GiB ran 0/8. The container needs ~9GB and gets it.
          # The original 2/6 env-start failures (goreleaser/query-persist) are a SEPARATE flaky issue,
          # handled by task-level retry, NOT by clamping dockerd. vm.dirty_bytes still bounds writeback.
          printf '[Service]\nEnvironment=GOMEMLIMIT=10GiB\nMemoryHigh=11G\nMemoryAccounting=true\n' | sudo tee /etc/systemd/system/docker.service.d/gt-oomfix.conf >/dev/null 2>&1 || true
          sudo sysctl -w vm.dirty_bytes=268435456 vm.dirty_background_bytes=134217728 >/dev/null 2>&1 || true
          sudo systemctl daemon-reload 2>/dev/null || true
          (sudo systemctl restart docker 2>/dev/null || sudo service docker restart 2>/dev/null) && sleep 8 || true
          echo "[OOMFIX] daemon (job-start): storage-driver=$(docker info -f '{{.Driver}}' 2>/dev/null) | MemoryHigh=11G GOMEMLIMIT=10GiB vm.dirty_bytes=256M (reverted 4GiB clamp that broke container start)"

      - name: GT substrate proof (handoff §B-AFTER/§D/§G) — pre-agent, pinned, read-only repo
        if: ${{ inputs.gt_arm != 'baseline' }}
        continue-on-error: true
        env:
          GT_MATRIX_TASK: ${{ matrix.task }}
          GT_MATRIX_IMAGE: ${{ matrix.image }}
          GT_MATRIX_LANGUAGE: ${{ matrix.language }}
          GT_INPUTS_ASSETS_REPO: ${{ inputs.assets_repo }}
          GT_GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GT_GITHUB_SHA: ${{ github.sha }}
          GT_PROOF_HARNESS: deepswe
        run: |
          # [WARM-CACHE TIME-SAVER] Pull the task image in the BACKGROUND, OVERLAPPING the substrate
          # proof (~15 min indexing — needs no task image). The pull (~10 min) hides fully under the
          # proof, so by the trial the docker daemon ALREADY HOLDS the image: the trial has ZERO pull
          # wait (saves ~the full pull time per task) AND never crosses pier's env-start timeout. The
          # image persists in the daemon across steps (same runner). overlay2 layer-by-layer keeps the
          # concurrent extract low-peak — the OOM fix still holds (RESMON/host143 verify). Best-effort:
          # a miss/timeout just leaves the trial's own pre-pull guard to pull it (no regression).
          if [ -n "${GT_MATRIX_IMAGE:-}" ]; then
            ( docker pull "$GT_MATRIX_IMAGE" >/tmp/gt_warmpull.log 2>&1 \
                && echo "[WARMPULL] task image warm in daemon (overlapped the proof — zero trial pull wait)" \
                || echo "[WARMPULL] background warm-pull miss — trial pre-pull will fetch it (fallback)" ) &
            _WARMPULL_PID=$!
          fi
          bash scripts/ci/substrate_proof.sh
          PROOF_RC=$?
          # Let the warm-pull finish before the step ends so the image is resident for the trial.
          [ -n "${_WARMPULL_PID:-}" ] && wait "$_WARMPULL_PID" 2>/dev/null
          cat /tmp/gt_warmpull.log 2>/dev/null | tail -1 || true
          exit $PROOF_RC
        # ^^ substrate_proof.sh holds the (extracted, 21k-limited) proof body; the wrapper above only
        # adds a background warm-pull of the task image so its ~10-min extract overlaps the ~15-min
        # proof instead of blocking the trial serially. All ${{ }} values are passed as env vars above.

      - name: Run GT trial
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Cert-env handoff (§D): GT_CERT_DIR / GT_HOST_GRAPH_DB / GT_HOST_SRC_ROOT + the cert
        # paths were written to $GITHUB_ENV by the substrate-proof step and are inherited here;
        # GT_PROOF_MODE / GT_CONTAINERIZED / GT_RUNTIME_STRATEGY come from the top-level env.
        # The HOST-SIDE adapter (gt_agent.py witness/brief) consumes the HOST paths READ-ONLY
        # and emits the §H [GT_META] witness to stdout (captured in trial_output.log).
        #
        # ── hole #5: UNCONDITIONAL env passthrough INTO THE TASK CONTAINER ──────────────
        # The in-container patch (gt_mini_patch.py) runs as part of the mini-swe-agent
        # PROCESS, which pier launches via `docker compose exec -e KEY=VALUE main ...`. The
        # GHA top-level env: / $GITHUB_ENV reach ONLY the host runner (pier) — pier does NOT
        # blanket-forward os.environ into the task container. The VERIFIED forwarding path is
        # `pier run --ae KEY=VALUE` -> AgentConfig.env (cli/jobs.py:620,629) -> factory
        # extra_env (agents/factory.py:120) -> agent._extra_env -> build_process_env
        # (agents/installed/base.py:251-255) -> exec_as_agent(env=) -> environment.exec(env=)
        # -> DockerEnvironment.exec appends `-e KEY=VALUE` (environments/docker/docker.py:
        # 679-681). So the consume path is NOT conditional on a launcher that may not set it —
        # every GT var is forwarded EXPLICITLY here.
        #
        # CONTAINER paths, not host paths: gt_mini_patch is INSIDE the container, so the env it
        # reads must point at /gt_artifacts — the in-container mount target. `--mounts-json`
        # bind-mounts the host substrate dir (/tmp/gt) -> /gt_artifacts READ-ONLY so the path
        # the env names actually exists in the container (the substrate graph is the ONE graph;
        # ro => the in-container patch can never mutate/rebuild it — no divergent reindex).
        run: |
          # Live log bridge + dockerd health check
          _LIVE_TASK="${{ matrix.task }}"; _STEPLOG="/tmp/gha_step_${_LIVE_TASK}.log"
          exec > >(tee -a "$_STEPLOG") 2>&1
          GH_LIVE_TOKEN="${{ secrets.GITHUB_TOKEN }}" bash scripts/ci/live_log_push.sh "$_LIVE_TASK" "$_STEPLOG" "$(pwd)/trial_output.log" 20 >/dev/null 2>&1 &
          if ! docker info >/dev/null 2>&1; then
            echo "[DOCKERD-FIX] restarting"; (sudo systemctl restart docker 2>/dev/null || sudo service docker restart 2>/dev/null) && sleep 10 || true
          fi
          echo "=== DeepSWE GT Trial: ${{ matrix.task }} (model ${{ inputs.model }}) ==="
          echo "HOST  GT_CERT_DIR=${GT_CERT_DIR:-<unset>}  GT_HOST_GRAPH_DB=${GT_HOST_GRAPH_DB:-<unset>}"
          echo "GT_PROOF_MODE=${GT_PROOF_MODE:-<unset>}  GT_CONTAINERIZED=${GT_CONTAINERIZED:-<unset>}  GT_SUBSTRATE_DIGEST=${GT_SUBSTRATE_DIGEST:-<unset>}"

          # In-container paths (host /tmp/gt -> /gt_artifacts:ro).
          GT_C_ARTIFACTS=/gt_artifacts
          HOST_ARTIFACTS="${GT_CERT_DIR:-/tmp/gt}"
          # Ensure bind source exists.
          mkdir -p "${HOST_ARTIFACTS}"

          PROOF_STATE=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/gt/proof_verdict.json")
          if not p.exists():
              p = pathlib.Path("/tmp/gt/proof_status.json")
          if not p.exists():
              print("missing")
          else:
              try:
                  print(json.loads(p.read_text(encoding="utf-8")).get("state") or "missing")
              except Exception:
                  print("invalid")
          PY
          )
          if [ "${GT_BASELINE:-0}" != "1" ] && [ "$PROOF_STATE" != "ok" ]; then
            echo "GT_RUN_PROOF_FAIL: refusing paid agent run because substrate proof verdict state=${PROOF_STATE}" | tee -a trial_output.log
            exit 1
          fi

          # SPEED-OPT E: host-side /opt/gt:ro mount (replaces 30 b64 layers).
          HOST_GT_INJECT=/tmp/gt_inject/opt/gt
          mkdir -p "${HOST_GT_INJECT}"
          mkdir -p "${HOST_GT_INJECT}/groundtruth"
          cp artifact_deepswe/gt_mini_patch.py "${HOST_GT_INJECT}/"
          cp artifact_deepswe/gt_hook.py        "${HOST_GT_INJECT}/" 2>/dev/null || true
          cp artifact_deepswe/gt_oracle.py      "${HOST_GT_INJECT}/" 2>/dev/null || true
          cp artifact_deepswe/gt_oracle_sense.py "${HOST_GT_INJECT}/" 2>/dev/null || true
          cp artifact_deepswe/phase_policy.py   "${HOST_GT_INJECT}/" 2>/dev/null || true
          # Product packages — the single-source. GATE FIX (port of swebench_live_lite_full.yml
          # L1171-1186): under GT_RL_PROFILE=2 gt_mini_patch imports the SM engines (global_arbiter,
          # hypothesis_ledger, verification_plan, edit_overlay, xsession_memory, ...) which live in
          # SUBPACKAGES + the groundtruth.trajectory package. The old `cp .../*.py` staged ONLY the
          # flat top-level modules of {runtime,delivery,pretask} and NOT trajectory, so pier crashed:
          # "RuntimeError: gt_mini_patch.py imports groundtruth modules NOT covered by [staged set]".
          # Use `cp -r .../.` (recursive, subpackages) AND stage trajectory — matches the live-lite
          # working profile-2 path.
          for pkg in runtime delivery pretask trajectory; do
            if [ -d "src/groundtruth/${pkg}" ]; then
              mkdir -p "${HOST_GT_INJECT}/groundtruth/${pkg}"
              cp -r "src/groundtruth/${pkg}/." "${HOST_GT_INJECT}/groundtruth/${pkg}/" 2>/dev/null || true
              touch "${HOST_GT_INJECT}/groundtruth/${pkg}/__init__.py"
            fi
          done
          touch "${HOST_GT_INJECT}/groundtruth/__init__.py"
          echo "GT inject staged: $(find "${HOST_GT_INJECT}" -name '*.py' | wc -l) Python files"

          # L6-FRESH: stage the gt-index binary into /opt/gt so the in-container post-edit
          command -v musl-gcc >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y musl-tools; } >/dev/null 2>&1 || true
          if command -v musl-gcc >/dev/null 2>&1 && command -v go >/dev/null 2>&1 && [ -d gt-index ]; then
            (cd gt-index && CGO_ENABLED=1 CC=musl-gcc go build -tags 'netgo,osusergo,sqlite_fts5' \
               -ldflags='-s -w -extldflags "-static"' -o "${HOST_GT_INJECT}/gt-index" ./cmd/gt-index/) \
              && chmod +x "${HOST_GT_INJECT}/gt-index" \
              && echo "L6 gt-index built static/musl+FTS5: $(file "${HOST_GT_INJECT}/gt-index" 2>/dev/null)" \
              || echo "WARN: gt-index musl build failed — L6-fresh reindex falls back (correct-or-quiet)"
          else
            echo "WARN: musl-gcc/go/gt-index absent — L6-fresh reindex falls back (correct-or-quiet)"
          fi

          # Bind-mount the host substrate dir into the task container READ-ONLY. JSON is the
          HOST_GT_OUT=/tmp/gt_out
          mkdir -p "${HOST_GT_OUT}" && chmod 777 "${HOST_GT_OUT}"
          MOUNTS_JSON="[{\"type\":\"bind\",\"source\":\"${HOST_ARTIFACTS}\",\"target\":\"${GT_C_ARTIFACTS}\",\"read_only\":true},{\"type\":\"bind\",\"source\":\"${HOST_GT_OUT}\",\"target\":\"/gt_out\",\"read_only\":false},{\"type\":\"bind\",\"source\":\"/tmp/gt_inject/opt/gt\",\"target\":\"/opt/gt\",\"read_only\":true}]"
          echo "CONTAINER mount: ${HOST_ARTIFACTS} -> ${GT_C_ARTIFACTS} (ro); ${HOST_GT_OUT} -> /gt_out (rw); /tmp/gt_inject/opt/gt -> /opt/gt (ro)"
          echo "mounts-json: ${MOUNTS_JSON}"

          # BUG#1+#2 FIX (single-source de-drift): source the canonical --ae block so the
          export GT_C_OUT=/gt_out
          # GATE FIX (port of swebench_live_lite_full.yml #72): emit the capability RECEIPT
          # from the REAL substrate BEFORE gt_ae_block.sh runs the RL-profile preflight, so
          # the substrate-property members (GT_CONTENT_LEG / GT_L6_FRESH) are ADMITTED
          # instead of failing ALL-closed on an empty receipt (which aborted Profile-2 before
          # the agent ran — GT_RL_PREFLIGHT_ABORT unavailable=GT_CONTENT_LEG,GT_L6_FRESH).
          # Host-side (DeepSWE sources gt_ae_block.sh on the host): reads the base substrate
          # graph (GT_HOST_GRAPH_DB=/tmp/gt/graph.db, written by the substrate-proof step) +
          # the HOST-staged gt-index (/tmp/gt_inject/opt/gt/gt-index). Absent/empty surface =>
          # empty receipt => those members correctly fail-closed (never self-attested). Skipped
          # in baseline (control arm stays pure). MUST precede the gt_ae_block.sh source below.
          if [ "${GT_BASELINE:-0}" != "1" ]; then
            export GT_CAPABILITY_RECEIPT="$(GT_INDEX_BIN="/tmp/gt_inject/opt/gt/gt-index" GT_HOST_GRAPH_DB="${GT_HOST_GRAPH_DB:-/tmp/gt/graph.db}" PYTHONPATH="/tmp/gt_inject/opt/gt" python3 -m groundtruth.runtime.capability_receipt --emit-json 2>/tmp/gt_receipt_err.txt || echo "{}")"
            echo "[GT] capability receipt (host): ${GT_CAPABILITY_RECEIPT}"
          fi
          # shellcheck source=artifact_deepswe/gt_integration/gt_ae_block.sh
          source artifact_deepswe/gt_integration/gt_ae_block.sh
          echo "GT_AE_ARGS (block): ${GT_AE_ARGS[*]}"

          # L6-FRESH activation: point the in-container reindex at the staged binary and
          GT_AE_ARGS+=(--ae "GT_INDEX_BIN=/opt/gt/gt-index" --ae "GT_L6_FRESH=1")

          # PARITY (2026-07-08): the OFFICIAL container carries NO GT surfaces. Measured
          # firing delta, not cosmetic: the baseline agent explored /gt_artifacts + /gt_out
          # "for test hints" (run 28914558732, mobly msg34). Baseline arm ⇒ ZERO GT mounts,
          # ONLY the GT_BASELINE switch; gt arm ⇒ the full list, byte-identical to before.
          GT_AE_ARM=()
          if [ "${GT_BASELINE:-0}" = "1" ]; then
            MOUNTS_JSON="[]"
            GT_AE_ARM+=(--ae GT_BASELINE="1")
          else
            # HOST pier process must see GT_MOUNT_MODE at BUILD-SPEC time: gt_agent.py
            # _inject_steps() reads os.environ HERE (when it generates the agent-install
            # Dockerfile), and picks _inject_steps_mount_mode() only if it is "1". The
            # --ae below reaches the agent CONTAINER runtime — too late to steer which
            # injection path bakes the image. Without this export the base64 path runs and
            # inlines graph.db -> a 3.39MB Dockerfile -> BuildKit "message larger than max
            # (16MB gRPC)" hard-fail (and forces the slow legacy builder on box).
            export GT_MOUNT_MODE=1
            GT_AE_ARM+=(
              --ae GT_HOST_GRAPH_DB="${GT_C_ARTIFACTS}/graph.db"
              --ae GT_CERT_DIR="${GT_C_ARTIFACTS}"
              --ae GT_HOST_SRC_ROOT="${GT_C_ARTIFACTS}/src"
              --ae GT_PORTABLE_SUBSTRATE="1"
              --ae GT_FORBID_PREBUILT_GRAPH="1"
              --ae GT_PROOF_MODE="${GT_PROOF_MODE:-1}"
              --ae GT_CONTAINERIZED="1"
              --ae GT_RUNTIME_STRATEGY="${GT_RUNTIME_STRATEGY:-unified_substrate}"
              --ae GT_STEP_LIMIT="${GT_STEP_LIMIT:-}"
              --ae GT_VERIFICATION_CYCLE_COST="${GT_VERIFICATION_CYCLE_COST:-}"
              --ae GT_SELF_VERIFY_ATTEMPTS="${GT_SELF_VERIFY_ATTEMPTS:-}"
              --ae GT_BASELINE="${GT_BASELINE:-0}"
              --ae GT_VERIFY_STRUCTURAL_RISK="${GT_VERIFY_STRUCTURAL_RISK:-0}"
              --ae GT_VERIFY_EXECUTE="${GT_VERIFY_EXECUTE:-0}"
              --ae GT_EDIT_CHECK="${GT_EDIT_CHECK:-0}"
              --ae GT_POST_SEARCH_NATIVE="${GT_POST_SEARCH_NATIVE:-0}"
              --ae GT_GATEWAY="${GT_GATEWAY:-0}"
              --ae GT_GATEWAY_NATIVE="${GT_GATEWAY_NATIVE:-0}"
              --ae GT_STEER_NATIVE="${GT_STEER_NATIVE:-0}"
              --ae GT_LANE_ENVELOPE="${GT_LANE_ENVELOPE:-0}"
              --ae GT_OBLIGATION_FRESHNESS="${GT_OBLIGATION_FRESHNESS:-0}"
              --ae GT_D7_RELATEDNESS="${GT_D7_RELATEDNESS:-0}"
              --ae GT_DCC="${GT_DCC:-0}"
              --ae GT_NEG_EVIDENCE="${GT_NEG_EVIDENCE:-0}"
              --ae GT_TYPEFLOW_FIXPOINT="${GT_TYPEFLOW_FIXPOINT:-0}"
              --ae GT_FIELD_CANDIDATES="${GT_FIELD_CANDIDATES:-0}"
              --ae GT_SEM_BODY="${GT_SEM_BODY:-0}"
              --ae GT_PASSAGE_WIDE="${GT_PASSAGE_WIDE:-0}"
              --ae GT_CONTENT_LEG="${GT_CONTENT_LEG:-1}"
              --ae GT_POST_SEARCH="${GT_POST_SEARCH:-0}"
              --ae GT_CONSENSUS_LEDGER="${GT_CONSENSUS_LEDGER:-0}"
              --ae GT_MOUNT_MODE="1"
              # Provenance only: the members above already carry the RL-profile-resolved
              # values (gt_ae_block.sh fan-out exported them before this array was built).
              --ae GT_RL_PROFILE="${GT_RL_PROFILE:-}"
            )
            GT_AE_ARM+=("${GT_AE_ARGS[@]}")
            GT_AE_ARM+=(
              --ae GT_ESC_ADV_TCOV="${GT_ESC_ADV_TCOV:-}"
              --ae GT_ESC_ADV_B="${GT_ESC_ADV_B:-}"
              --ae GT_ESC_URG_TCOV="${GT_ESC_URG_TCOV:-}"
              --ae GT_ESC_URG_B="${GT_ESC_URG_B:-}"
              --ae GT_ESC_GATE_TCOV="${GT_ESC_GATE_TCOV:-}"
              --ae GT_ESC_GATE_KV="${GT_ESC_GATE_KV:-}"
              --ae GT_ORACLE_EVENTS="${GT_C_OUT}/gt_oracle_events.jsonl"
              --ae GT_RUNTIME_LEDGER="${GT_C_OUT}/gt_runtime_ledger.jsonl"
              --ae GT_HOOK_FIRE_COUNTS="${GT_C_OUT}/gt_hook_fire_counts.json"
            )
          fi

          # Forward the SUBSTRATE-CONSUME env into the container, pointing at /gt_artifacts.
          set +e
          set -o pipefail
          # Model routing: if the input model contains "MiniMax" or "tokenrouter",
          INPUT_MODEL="${{ inputs.model }}"
          # 2026-07-24: z-ai/glm-* also routes via TokenRouter (the FREE glm-5.2-free tier is the
          # feature-WITNESS model: $0, and a weaker model is MORE likely to make the mistakes that
          # trigger the mistake-gated capabilities — syntax_result / signature_delta / submit_refusal
          # — which deepseek-v4-pro was too strong to trip). HARD CONSTRAINT: the free tier caps at
          # 50 requests/min PER KEY (failed attempts count), so a run on it MUST use max_parallel=1;
          # parallel task workers trip 429 storms within seconds.
          if echo "$INPUT_MODEL" | grep -qiE "minimax|tokenrouter|z-ai/|glm-"; then
            export TOKENROUTER_API_KEY="${{ secrets.TOKENROUTER_API_KEY }}"
            export OPENAI_API_KEY="${TOKENROUTER_API_KEY}"
            export OPENAI_API_BASE="https://api.tokenrouter.com/v1"
            # FIX: forward the model creds INTO the container. The agent runs in-container via
            GT_AE_ARGS+=(--ae "OPENAI_API_KEY=${OPENAI_API_KEY}" --ae "OPENAI_API_BASE=${OPENAI_API_BASE}")
            if ! echo "$INPUT_MODEL" | grep -q "^openai/"; then
              INPUT_MODEL="openai/${INPUT_MODEL}"
            fi
            echo "=== Model routed via TokenRouter: $INPUT_MODEL ==="
          elif echo "$INPUT_MODEL" | grep -qiE "openrouter/|xiaomi/mimo"; then
            export OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"
            GT_AE_ARGS+=(--ae "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}")
            echo "=== Model routed via OpenRouter: $INPUT_MODEL ==="
          elif echo "$INPUT_MODEL" | grep -qiE "deepseek"; then
            export DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
            GT_AE_ARGS+=(--ae "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}")
            echo "=== Model routed via DeepSeek native: $INPUT_MODEL ==="
          fi
          # [OOM FIX 2026-06-16] RESMON ground truth (run 27650378892, expr): the GT HOST
          if ! swapon --show 2>/dev/null | grep -q /gt_swap; then
            FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
            if [ "${FREE_GB:-0}" -ge 30 ]; then
              sudo fallocate -l 24G /gt_swap 2>/dev/null || sudo dd if=/dev/zero of=/gt_swap bs=1M count=24576 status=none 2>/dev/null
              sudo chmod 600 /gt_swap 2>/dev/null && sudo mkswap /gt_swap >/dev/null 2>&1 && sudo swapon /gt_swap 2>/dev/null \
                && echo "[OOMFIX] 24G swap enabled; $(free -m | grep -i swap)" \
                || echo "[OOMFIX] swap setup failed (continuing without it)"
            else
              echo "[OOMFIX] skip swap: only ${FREE_GB:-0}GB free"
            fi
          fi
          # Inject memswap_limit=-1 into pier's compose so the eval container can page into the 24G
          PIER_COMPOSE=$(python -c "from pier.environments.docker import COMPOSE_BASE_PATH; print(COMPOSE_BASE_PATH)" 2>/dev/null || true)
          if [ -z "$PIER_COMPOSE" ] || [ ! -f "$PIER_COMPOSE" ]; then
            PIER_COMPOSE=$(find / -name docker-compose-base.yaml -path '*pier*' 2>/dev/null | head -1)
          fi
          if [ -n "$PIER_COMPOSE" ] && [ -f "$PIER_COMPOSE" ]; then
            grep -q "memswap_limit" "$PIER_COMPOSE" || sed -i '/^  main:/a\    memswap_limit: -1' "$PIER_COMPOSE"
            echo "[OOMFIX] pier eval container memswap_limit=-1 added (deploy.resources cap kept) at $PIER_COMPOSE"
            grep -nE "main:|memswap_limit|memory:" "$PIER_COMPOSE" | head
          else
            echo "::error::[OOMFIX] pier docker-compose-base.yaml NOT FOUND — cap NOT enforced, giants will OOM. PATH resolution broken."
          fi
          # (overlay2 + daemon constraints are now configured ONCE in the pre-proof step
          ( while true; do
              echo "[RESMON] $(date +%T)" \
                "$(free -m 2>/dev/null | awk '/Mem:/{printf "mem=%d/%dMB", $3,$2}')" \
                "$(df -m / 2>/dev/null | awk 'NR==2{printf "disk_used=%d/%dMB free=%dMB", $3,$2,$4}')" \
                "containers=$(docker ps -q 2>/dev/null | wc -l | tr -d ' ')"
              # [DIAG 2026-06-20] top-RSS processes — answers leak-vs-capacity: WHICH process
              echo "[RESTOP] $(ps -eo rss=,comm=,args= --sort=-rss 2>/dev/null | head -4 \
                | awk '{rss=int($1/1024); $1=""; cmd=substr($0,2,70); printf "%dMB:%s | ", rss, cmd}')"
              # [MEMDIAG 2026-06-20] WHAT is in dockerd's 15GB? RssAnon=heap (real buffer/leak) vs
              DPID=$(pgrep -x dockerd 2>/dev/null | head -1)
              [ -n "$DPID" ] && echo "[MEMDIAG] dockerd($DPID): $(grep -E '^Vm(RSS|Swap)|^Rss(Anon|File|Shmem)' /proc/$DPID/status 2>/dev/null | awk '{printf "%s=%s%s ",$1,$2,$3}')"
              echo "[MEMDIAG] meminfo: $(grep -E '^(MemTotal|MemFree|MemAvailable|Cached|AnonPages|Slab|Mapped):' /proc/meminfo 2>/dev/null | awk '{printf "%s=%dMB ",$1,int($2/1024)}')"
              sleep 8
            done ) &
          _RESMON_PID=$!
          trap 'kill "$_RESMON_PID" 2>/dev/null' EXIT
          # [ENV-START FIX] Pre-pull the task image so the slow overlay2+throttle EXTRACT happens
          echo "[PREPULL] ensuring task image is local before pier env-start: ${{ matrix.image }}"
          if docker image inspect "${{ matrix.image }}" >/dev/null 2>&1; then
            echo "[PREPULL] task image ALREADY LOCAL (GHCR mirror + tag from the proof) — zero ECR contact"
          elif timeout 1800 docker pull "${{ matrix.image }}" >/dev/null 2>&1; then
            echo "[PREPULL] task image warm (local)"
          else
            echo "[PREPULL] pre-pull miss/timeout — pier will pull in env-start (fallback)"
          fi
          # [ENV-START FIX] FROM pre-built image, not a from-scratch rebuild (the OOM-hang). See script.
          bash scripts/ci/slim_task_dockerfile.sh "${{ matrix.task }}" "${{ matrix.image }}"
          # [COMPOSE PULL-NEVER SHIM] pier's `docker compose up` re-pulls the task image from flaky
          bash scripts/ci/install_compose_shim.sh
          export PATH="/tmp/gt-shim:$PATH"
          echo "[gt-shim] active; resolved=$(command -v docker)"
          # [ENV-START FAIL-FAST + RETRY] pier (bg) + watch docker ps; no container in 900s -> dump
          set +e
          docker ps -aq 2>/dev/null | xargs -r docker rm -f >/dev/null 2>&1 || true
          PIER_RC=124
          _ENV_ATTEMPTS="${GT_ENV_START_ATTEMPTS:-3}"
          _ENV_WATCH_TICKS="${GT_ENV_START_WATCH_TICKS:-180}"  # 180 * 10s = 1800s = 30min window (was 90/15min; arktype/TS consistently timed out at 900s with 1.3GB free — the SLIM Dockerfile is instant but docker compose overlay extraction is slow on heavy TS images)
          for _A in $(seq 1 "$_ENV_ATTEMPTS"); do
          echo "[ENV-START] attempt $_A/$_ENV_ATTEMPTS — pier (bg) + container watcher (window=$((_ENV_WATCH_TICKS*10))s)"
          : > trial_output.log
          pier run \
            -p deepswe-bench/tasks/${{ matrix.task }} \
            --agent-import-path artifact_deepswe.gt_agent:GTMiniSweAgent \
            --model "$INPUT_MODEL" \
            --env docker \
            -y \
            --mounts-json "${MOUNTS_JSON}" \
            "${GT_AE_ARM[@]}" \
            --ak version=2.2.8 \
            --ak config_file=artifact_deepswe/gt_integration/deepswe_v1_parity_mimo.yaml \
            > trial_output.log 2>&1 &
          _PIER_PID=$!
          _STARTED=0
          for _i in $(seq 1 "$_ENV_WATCH_TICKS"); do
            sleep 10
            if ! kill -0 "$_PIER_PID" 2>/dev/null; then _STARTED=2; break; fi
            if [ "$(docker ps -q 2>/dev/null | wc -l)" -gt 0 ]; then _STARTED=1; break; fi
          done
          if [ "$_STARTED" -eq 1 ]; then
            echo "[ENV-START] eval container UP on attempt $_A (~$((_i*10))s) — agent running, awaiting completion"
            wait "$_PIER_PID"; PIER_RC=$?
            break
          fi
          if [ "$_STARTED" -eq 2 ]; then
            wait "$_PIER_PID"; PIER_RC=$?
            echo "[ENV-START] pier exited early on attempt $_A (rc=$PIER_RC) — taking outcome, no retry"
            break
          fi
          bash scripts/ci/dump_envstart_diag.sh "$_A" "$_ENV_WATCH_TICKS"
          kill "$_PIER_PID" 2>/dev/null; sleep 5; kill -9 "$_PIER_PID" 2>/dev/null
          pkill -9 -f "pier run" 2>/dev/null || true
          # [CLEANUP FIX] pier provisions via `docker compose up`; killing pier alone LEAKS the
          pkill -9 -f "docker.compose|docker-compose|swerex" 2>/dev/null || true
          docker ps -aq 2>/dev/null | xargs -r docker rm -f >/dev/null 2>&1 || true
          docker container prune -f >/dev/null 2>&1 || true
          docker network prune -f >/dev/null 2>&1 || true
          PIER_RC=124
          done
          cat trial_output.log 2>/dev/null || true
          set -e
          echo "=== Trial complete (pier rc=$PIER_RC) ===" | tee -a trial_output.log
          echo "PIER_EXIT_CODE=$PIER_RC" >> trial_output.log
          # FAIL-LOUD on a pier USAGE/ARG error (agent never ran) — a click arg error is a workflow
          if grep -qE "No such option|Usage: pier run|Error: Invalid value|Try 'pier run --help'" trial_output.log; then
            echo "::error::PIER_USAGE_ERROR — pier rejected its arguments and never ran the agent (see trial_output.log). This is a workflow/flag bug, not an agent outcome."
            grep -E "No such option|Usage: pier run|Error:" trial_output.log | head -5
            exit 1
          fi
          # P0.1-b: pier SWALLOWS adapter exceptions into result files (exception_message in
          if ! python3 scripts/swebench/adapter_error_scan.py jobs trial_output.log; then
            echo "DEEPSWE_ADAPTER_FAIL: adapter error found via structured result.json scan" | tee -a trial_output.log
          fi
          # F4: AGENT-CONTAINER OOM = a CLASSIFIED capacity kill (exit 137), not a silent SIGKILL.
          if [ "$PIER_RC" -eq 137 ] || grep -qE "OOMKilled|exit code 137|exited with code 137" trial_output.log; then
            echo "GT_AGENT_OOM: agent container hit the memory cap (rc/exit=137 — capacity kill, not logic)." | tee -a trial_output.log
          elif [ "$PIER_RC" -ne 0 ]; then
            echo "PIER_RUN_FAIL: pier run exited rc=$PIER_RC (agent crashed — artifacts will be captured)" | tee -a trial_output.log
          fi
          # NEVER exit 1 from trial — Collect/Upload MUST run to capture partial artifacts.

      - name: Verify DeepSWE adapter witness (§E DEEPSWE_ADAPTER_FAIL / §H consumption proof)
        continue-on-error: true
        if: ${{ !cancelled() && env.GT_PORTABLE_SUBSTRATE == '1' && inputs.gt_arm != 'baseline' }}
        run: |
          # AGENT-OBSERVATION truth: the adapter emitted a [GT_META] witness to stdout. Prove
          # (1) it consumed the substrate graph (gt_prebuilt_active=true) and (2) the consumed
          # graph fingerprints to the substrate's post-LSP hash (hook_graph_hash_matches_post_lsp=True).
          # Any error=DEEPSWE_ADAPTER_FAIL or a hash mismatch fails the task (no silent degrade).
          if grep -q "error=DEEPSWE_ADAPTER_FAIL" trial_output.log; then
            echo "DEEPSWE_ADAPTER_FAIL: the adapter failed to wire/consume the substrate artifacts:"
            grep "DEEPSWE_ADAPTER_FAIL" trial_output.log | head -5
            exit 1
          fi
          if ! grep -q "gt_prebuilt_active=true" trial_output.log; then
            echo "GT_ARTIFACT_NOT_CONSUMED: no [GT_META] witness with gt_prebuilt_active=true — the"
            echo "adapter did not consume the substrate graph (delivery, not telemetry)."
            grep "\[GT_META\]" trial_output.log | head -5 || echo "(no [GT_META] line at all)"
            exit 1
          fi
          if grep -q "hook_graph_hash_matches_post_lsp=False" trial_output.log; then
            echo "GRAPH_FAIL_HASH_MISMATCH: hook_graph_hash != graph_hash_after_lsp — the consumed"
            echo "graph diverges from the substrate's LSP-resolved graph."
            grep "hook_graph_hash_matches_post_lsp" trial_output.log | head -3
            exit 1
          fi
          echo "adapter witness OK: substrate graph consumed read-only; hook hash == post-LSP hash"
          grep "\[GT_META\] graph_witness" trial_output.log | head -2 || true

      - name: Collect results
        if: always()
        run: |
          mkdir -p trial_results trial_results/gt_artifacts
          cp trial_output.log trial_results/ 2>/dev/null || true
          cp /tmp/gt/proof_output.log trial_results/ 2>/dev/null || true
          cp /tmp/gt/graph.db trial_results/graph.db 2>/dev/null || true
          if [ -s trial_results/graph.db ]; then
            python3 scripts/swebench/resolution_method_audit.py --sample-limit 25 \
              trial_results/graph.db > trial_results/gt_artifacts/resolution_method_audit.json 2>/dev/null || true
          fi
          # §F.10 — upload the 8 GT artifacts the substrate emitted (the proof set, incl.
          # brief.txt + per-language LSP certs), even on task failure. graph.db is already
          # copied above; mirror the certs + manifests + brief.
          for a in runtime_context.json lsp_certificate.json graph_certificate.json \
                   embedder_certificate.json foundational_gate_report.json run_manifest.json \
                   brief.txt brief_result.json gt_issue_anchors.json gt_scope_files.txt gt_lsp_metrics.txt \
                   proof_progress.json proof_failure.json proof_verdict.json proof_status.json dep_store_manifest.json; do
            cp "/tmp/gt/$a" "trial_results/gt_artifacts/$a" 2>/dev/null || true
          done
          # P1-e: per-language LSP certificates (polyglot aggregation — no FAIL cert overwritten)
          cp /tmp/gt/lsp_certificate_*.json trial_results/gt_artifacts/ 2>/dev/null || true
          # The EXACT issue text the substrate ran with (§4 audit: what GT was given —
          # mirrors verified_run.yml's issue.txt upload).
          cp /tmp/issue.txt trial_results/gt_artifacts/issue.txt 2>/dev/null || true
          cp /tmp/gt/issue_manifest.json trial_results/gt_artifacts/issue_manifest.json 2>/dev/null || true
          cp /tmp/gt/delivered_instruction.txt trial_results/ 2>/dev/null || true
          cp /tmp/gt/adapter_witness.json trial_results/adapter_witness.json 2>/dev/null || true
          cp /tmp/gt/obligation_status.json trial_results/obligation_status.json 2>/dev/null || true
          cp /tmp/gt/run_provenance.json trial_results/gt_artifacts/run_provenance.json 2>/dev/null || true
          # FIX 2026-06-16: task_truth reads the runtime witness ([GT_META] gt_prebuilt_active +
          # hook_graph_hash_matches_post_lsp) ONLY from $GT_TRIAL_LOG (task_truth.py:293). Without
          # it, build_signal_record sees no witness -> reconcile_graph_handoff keeps the FALSE
          # GRAPH_FAIL_MISSING_HANDOFF (the pre-agent cert) and reconciled_substrate_verdict.json
          # wrongly stamps outcome_failure_class=GT, contradicting the (correct) outcome authority.
          # trial_output.log (tee'd by the agent step, carries the post-agent [GT_META]) is at CWD.
          GT_TRIAL_LOG=trial_output.log python3 scripts/swebench/task_truth.py jobs trial_results/task_truth.json 2>/dev/null || true
          # A7: industrial SOTA validation gate. Paid runs (GT_REQUIRE_FULL_STACK=1, unless
          # GT_ADVISORY_GATE=1) run --strict; enforcement is a dedicated POST-UPLOAD step so an
          # early exit here never drops the remaining harvest/artifacts (stderr now visible).
          _gate_args=""
          if [ "${GT_REQUIRE_FULL_STACK:-0}" = "1" ] && [ "${GT_ADVISORY_GATE:-0}" != "1" ]; then
            _gate_args="--strict"
          fi
          if python3 scripts/swebench/industrial_sota_validation_gate.py trial_results $_gate_args \
               > trial_results/industrial_sota_validation.json; then
            echo "industrial_sota_validation_gate: PASS (${_gate_args:-advisory})"
          else
            echo "::warning::industrial_sota_validation_gate FAILED (${_gate_args:-advisory}) — see industrial_sota_validation.json"
            [ -n "$_gate_args" ] && touch trial_results/INDUSTRIAL_GATE_FAILED
          fi
          if [ -d jobs ]; then
            mkdir -p trial_results/jobs
            find jobs -type f \( -name 'result.json' -o -name 'patch.diff' -o -name '*.patch' -o -name '*.trajectory.json' -o -name '*.json' -o -name '*.log' \) -size -25M -print0 \
              | xargs -0 -r cp --parents -t trial_results/jobs 2>/dev/null || true
          fi
          cp /tmp/gt/*.log              trial_results/ 2>/dev/null || true
          cp /tmp/gt/gt_interactions*.jsonl trial_results/ 2>/dev/null || true
          cp /tmp/gt/gt_hooks*.log      trial_results/ 2>/dev/null || true
          # FIX 3 (2026-06-11): harvest the oracle gate's 8-dp suppression telemetry
          # (written in-container to the writable /gt_out mount = host /tmp/gt_out).
          cp /tmp/gt_out/gt_oracle_events.jsonl trial_results/gt_oracle_events_${{ matrix.task }}.jsonl 2>/dev/null || true
          # BUG#2 FIX: harvest the FULL deep-telemetry trio the gt_ae_block.sh single-source
          # now points at /gt_out (runtime ledger + per-hook fire counts). Without this they
          # were lost with the ephemeral container (gt_mini_patch.py:3515,3569 default /tmp/*).
          # WARN loudly on a zero harvest so a silently-empty mount can't leave the run green.
          _gt_telemetry_recovered=0
          for _f in gt_runtime_ledger.jsonl gt_hook_fire_counts.json; do
            if [ -s "/tmp/gt_out/$_f" ]; then
              cp "/tmp/gt_out/$_f" "trial_results/${_f%.*}_${{ matrix.task }}.${_f##*.}" 2>/dev/null \
                && _gt_telemetry_recovered=$((_gt_telemetry_recovered + 1))
            fi
          done
          [ -s /tmp/gt_out/gt_oracle_events.jsonl ] && _gt_telemetry_recovered=$((_gt_telemetry_recovered + 1))
          if [ "$_gt_telemetry_recovered" -eq 0 ]; then
            echo "WARN: 0/3 deep-telemetry sinks recovered from /tmp/gt_out — in-container 8-dp" \
                 "producers wrote nothing (check the /gt_out mount is writable to the task uid)."
          else
            echo "deep-telemetry: recovered ${_gt_telemetry_recovered}/3 sink(s) from /tmp/gt_out"
          fi
          # Deep 8-dp metrics (constitution mandate: token/cost efficiency + per-layer)
          cp /tmp/gt/gt_run_summary*.json /tmp/gt_run_summary_${{ matrix.task }}.json 2>/dev/null || true
          cp /tmp/gt/gt_run_summary*.json trial_results/ 2>/dev/null || true
          PYTHONPATH=${{ github.workspace }}/src:${{ github.workspace }}/scripts/swebench:${{ github.workspace }}/scripts/metrics python3 scripts/swebench/gt_deep_metrics.py "${{ matrix.task }}" /tmp/gt --log trial_output.log 2>&1 | tail -2 || echo DEEP_METRICS_WARN
          cp /tmp/gt_deep_metrics_${{ matrix.task }}.json trial_results/ 2>/dev/null || true
          cp /tmp/gt_deep_metrics_${{ matrix.task }}.md   trial_results/ 2>/dev/null || true   # human-readable: steps/tokens/money/GT-delivery
          # Explicit artifact files for performance and behavioral-impact metrics.
          # gt_deep_metrics.py already imports these internally, but producing explicit
          # per-task artifact files makes them independently verifiable without parsing
          # the deep metrics blob.
          PYTHONPATH=${{ github.workspace }}/src:${{ github.workspace }}/scripts/swebench python3 scripts/swebench/gt_performance_metrics.py "$(find trial_results -name '*.trajectory.json' | head -1)" /tmp/gt --out trial_results/gt_performance_metrics_${{ matrix.task }}.json 2>&1 | tail -2 || echo PERF_METRICS_WARN
          PYTHONPATH=${{ github.workspace }}/scripts/swebench python3 scripts/swebench/gt_behavioral_impact.py "$(find trial_results -name '*.trajectory.json' | head -1)" --out trial_results/gt_behavioral_impact_${{ matrix.task }}.json 2>&1 | tail -2 || echo IMPACT_METRICS_WARN
          # Run provenance on the DeepSWE path: the REAL provenance manifest is
          # run_manifest.json (emitted by gt-run-proof inside the substrate; copied into
          # trial_results/gt_artifacts/ above — gt_git_commit / substrate_digest /
          # task_repo_commit / runtime_flags / language_distribution / graph_db_sha256 /
          # cert_versions). The old gt_legitimacy_manifest_*.json copy was DEAD — no
          # DeepSWE step ever wrote it (scripts/verify/legitimacy.py is OH-path only).
          # Plus a small per-job provenance file: bench clone SHA + GT commit + digest.
          python3 -c "import json,os;json.dump({'schema':'gt.deepswe_run_provenance.v1','task':'${{ matrix.task }}','deepswe_bench_sha':os.environ.get('GT_DEEPSWE_BENCH_SHA') or None,'gt_git_commit':os.environ.get('GITHUB_SHA') or None,'substrate_digest':os.environ.get('GT_SUBSTRATE_DIGEST') or None,'workflow_run_id':os.environ.get('GITHUB_RUN_ID') or None,'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT') or None},open('trial_results/gt_artifacts/run_provenance.json','w'),indent=2)" \
            || echo "WARN: run_provenance.json write failed"
          # Outcome classification (INFRA > GT > RESOLVED > AGENT) — PERSISTED as
          # outcome.json in the artifact (GT_DEEPSWE_OUTCOME_JSON), not just printed:
          # the summarize job + the §4/§5 audit consume the machine-readable record.
          GT_TRIAL_LOG=trial_output.log GT_CERT_DIR=/tmp/gt \
            GT_DEEPSWE_OUTCOME_JSON=trial_results/outcome.json \
            python3 scripts/verify/deepswe_outcome.py jobs || echo "WARN: outcome extract failed"
          find trial_results -type f 2>/dev/null | head -40 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepswe-full-${{ matrix.task }}
          path: trial_results/
          retention-days: 30
          if-no-files-found: warn

      # A7: enforce the industrial SOTA gate AFTER upload so a strict failure reds the task
      # job (industrially-invalid run must not pass silently) without ever losing artifacts.
      # Only fires when Collect wrote the marker (paid --strict run + gate contradicted).
      - name: Enforce industrial SOTA gate (strict, post-upload)
        # Baseline-aware (2026-07-08): the gate demands GT proof artifacts the baseline arm
        # legitimately lacks — it failed every baseline job cosmetically (run 28914558732).
        if: ${{ always() && inputs.gt_arm != 'baseline' }}
        run: |
          if [ -f trial_results/INDUSTRIAL_GATE_FAILED ]; then
            echo "::error::Industrial SOTA validation gate failed under --strict — run is industrially INVALID"
            head -60 trial_results/industrial_sota_validation.json 2>/dev/null || true
            exit 1
          fi
          echo "industrial SOTA gate: OK (or advisory-only)"

      - name: Cleanup runner disk (post-upload, non-critical)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Results are already UPLOADED (prior step) and the GitHub runner is EPHEMERAL
          # (destroyed after the job) — so this cleanup is purely cosmetic. The heavy
          # `docker system prune -af --volumes` over a GIANT task image's layers ran ~6 min on
          # goreleaser and the runner went unresponsive under the prune I/O → GHA reclaimed it →
          # step CANCELLED → the job was marked FAILURE on a run whose agent + GT + upload ALL
          # SUCCEEDED. Drop the heavy docker prune (pointless on an ephemeral, post-upload runner);
          # keep only instant ops. timeout-minutes:2 + continue-on-error make this step structurally
          # unable to fail a clean job (a hang times out → continue-on-error swallows it).
          sudo swapoff /gt_swap 2>/dev/null || true; sudo rm -f /gt_swap 2>/dev/null || true
          rm -f /tmp/gt-substrate.tar.gz /tmp/docker.tgz /tmp/deepswe-bench.tar.gz 2>/dev/null || true

  summarize:
    # prepare is in needs so its outputs (total, bench_sha) are guaranteed in the needs
    # context here (GHA populates needs.<job> only for DIRECT dependencies).
    needs: [prepare, trial]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/all
          pattern: deepswe-full-*
      - name: Aggregate DeepSWE benchmark results
        run: |
          echo "## DeepSWE full benchmark — ${{ needs.prepare.outputs.total }} tasks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Run provenance (Stage-5): which code produced this run.
          echo "**Provenance** — GT commit: \`${{ github.sha }}\` | deepswe-bench clone SHA: \`${{ needs.prepare.outputs.bench_sha }}\` | substrate digest: \`${GT_SUBSTRATE_DIGEST:-<unset>}\`" >> $GITHUB_STEP_SUMMARY
          echo "Per-task: \`gt_artifacts/run_manifest.json\` (gt_git_commit / substrate_digest / task_repo_commit / runtime_flags / language_distribution / graph_db_sha256 / cert_versions) + \`gt_artifacts/run_provenance.json\` (per-job bench SHA)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # P0.1-d: parse the n_agent_steps VALUE and require >0. The old check counted the
          # mere PRESENCE of the token "AGENT_RAN_STEPS|n_agent_steps" — a 0-step / None /
          # UNKNOWN launch failure carries the token too, so a whole-run launch outage still
          # summarized as "agent-ran" (the green-zero-run chain). Numeric-only match:
          # AGENT_RAN_STEPS=None / =UNKNOWN do NOT parse; absent or ==0 counts as launch-fail.
          RAN=0; TOTAL=0; LAUNCH_FAIL=0
          for d in /tmp/all/deepswe-full-*; do
            [ -d "$d" ] || continue
            TOTAL=$((TOTAL+1))
            STEPS=$(grep -rhoE "AGENT_RAN_STEPS=[0-9]+" "$d" 2>/dev/null | head -1 | grep -oE "[0-9]+$" || true)
            if [ -z "$STEPS" ]; then
              STEPS=$(grep -rhoE '"n_agent_steps"[[:space:]]*:[[:space:]]*[0-9]+' "$d" 2>/dev/null | head -1 | grep -oE "[0-9]+$" || true)
            fi
            if [ -n "$STEPS" ] && [ "$STEPS" -gt 0 ]; then
              RAN=$((RAN+1))
            else
              LAUNCH_FAIL=$((LAUNCH_FAIL+1))
              echo "launch-fail (n_agent_steps=${STEPS:-absent}): $(basename "$d")"
            fi
          done
          echo "Artifacts collected: $TOTAL  |  agent-ran (n_agent_steps>0 PARSED): $RAN  |  launch-fail (steps 0/absent): $LAUNCH_FAIL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      - name: Classification tally (INFRA > GT > RESOLVED > AGENT, infra-excluded denominator)
        run: |
          # Aggregate the per-task outcome.json records the Collect step persisted.
          # Same denominator rule as scripts/verify/deepswe_outcome.py (imported, not
          # re-implemented): INFRA/UNKNOWN excluded; resolved_rate at 8-dp.
          python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, sys
          sys.path.insert(0, "scripts/verify")
          from deepswe_outcome import tally_classes
          recs, missing = [], []
          for d in sorted(glob.glob("/tmp/all/deepswe-full-*")):
              task = d.split("deepswe-full-", 1)[-1]
              try:
                  with open(f"{d}/outcome.json", encoding="utf-8") as f:
                      recs.extend(json.load(f).get("tasks") or [])
              except (OSError, ValueError):
                  missing.append(task)
          t = tally_classes(recs)
          print("### Outcome classification (per-task `outcome.json`)")
          print()
          print("| class | count |")
          print("|---|---:|")
          for k in ("RESOLVED", "AGENT", "GT", "INFRA", "UNKNOWN"):
              print(f"| {k} | {t['counts'].get(k, 0)} |")
          print()
          print(f"**resolved_rate = {t['resolved_rate']}** over denominator "
                f"{t['denominator_excluding_infra']} (INFRA/UNKNOWN excluded: "
                f"{t['excluded_from_denominator']})")
          if missing:
              print()
              print(f"outcome.json MISSING for {len(missing)} task(s) (job died before "
                    f"Collect — triage in the per-task artifact): {', '.join(missing[:10])}"
                    + (" ..." if len(missing) > 10 else ""))
          PYEOF
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Per-task detail: \`outcome.json\` (classification) + \`gt_deep_metrics_<task>.json\` (8-dp) + \`gt_artifacts/\` (8-artifact proof set incl. brief.txt + issue.txt) + \`jobs/\` (trajectory + verifier) inside each \`deepswe-full-<task>\` artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Pull any task MID-RUN once its job finishes: \`gh run download <run_id> -n deepswe-full-<task> -R <owner>/groundtruth\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce run verdict (red ONLY on systemic failure — a few INFRA stays green)
        run: |
          # H8: the PAID run must NOT pass GREEN on a wholesale agent/launch/collect outage.
          # Every per-task step stays continue-on-error/always() (capture EVERYTHING — telemetry
          # is never lost), so ONLY this AGGREGATE gate can red the run, and ONLY on SYSTEMIC
          # failure. A handful of INFRA / missing tasks among many is BEST-EFFORT and stays
          # green (PRODUCT RULE: GT never refuses for quality; a few infra tasks ≠ lost signal).
          # Hard-red ONLY when the run carried no usable signal: 0 artifacts, 0 agents ran, or
          # launch-fail / INFRA / missing-outcome EACH exceeding 50% of tasks. Mirrors the
          # 'Enforce ... verdict ... exit 1' aggregate gate in deepswe_proof_sweep.yml.
          RAN=0; TOTAL=0; LAUNCH_FAIL=0
          for d in /tmp/all/deepswe-full-*; do
            [ -d "$d" ] || continue
            TOTAL=$((TOTAL+1))
            # Same numeric n_agent_steps parse as the Aggregate step (None/UNKNOWN do NOT parse).
            STEPS=$(grep -rhoE "AGENT_RAN_STEPS=[0-9]+" "$d" 2>/dev/null | head -1 | grep -oE "[0-9]+$" || true)
            if [ -z "$STEPS" ]; then
              STEPS=$(grep -rhoE '"n_agent_steps"[[:space:]]*:[[:space:]]*[0-9]+' "$d" 2>/dev/null | head -1 | grep -oE "[0-9]+$" || true)
            fi
            if [ -n "$STEPS" ] && [ "$STEPS" -gt 0 ]; then RAN=$((RAN+1)); else LAUNCH_FAIL=$((LAUNCH_FAIL+1)); fi
          done
          # INFRA(+UNKNOWN) and missing-outcome.json counts via the SAME tally_classes the
          # Classification step uses (imported, not re-implemented).
          python3 << 'PYEOF' > /tmp/enforce_counts
          import glob, json, sys
          sys.path.insert(0, "scripts/verify")
          from deepswe_outcome import tally_classes
          recs, missing = [], 0
          for d in sorted(glob.glob("/tmp/all/deepswe-full-*")):
              try:
                  with open(f"{d}/outcome.json", encoding="utf-8") as f:
                      recs.extend(json.load(f).get("tasks") or [])
              except (OSError, ValueError):
                  missing += 1
          t = tally_classes(recs)
          print(t["counts"].get("INFRA", 0) + t["counts"].get("UNKNOWN", 0), missing)
          PYEOF
          read INFRA MISSING < /tmp/enforce_counts
          INFRA=${INFRA:-0}; MISSING=${MISSING:-0}
          echo "enforce: total=$TOTAL ran=$RAN launch_fail=$LAUNCH_FAIL infra=$INFRA missing_outcome=$MISSING (systemic threshold: >50% of total, or 0 agents ran)"
          FAIL=""
          if [ "$TOTAL" -eq 0 ]; then FAIL="${FAIL}0 task artifacts collected (whole-run outage); "; fi
          if [ "$TOTAL" -gt 0 ] && [ "$RAN" -eq 0 ]; then FAIL="${FAIL}0 agents ran (n_agent_steps>0 on NO task); "; fi
          # integer-safe '>50%': 2*count > total
          if [ "$TOTAL" -gt 0 ] && [ $((LAUNCH_FAIL*2)) -gt "$TOTAL" ]; then FAIL="${FAIL}launch-fail $LAUNCH_FAIL > 50% of $TOTAL; "; fi
          if [ "$TOTAL" -gt 0 ] && [ $((INFRA*2)) -gt "$TOTAL" ]; then FAIL="${FAIL}INFRA/UNKNOWN $INFRA > 50% of $TOTAL; "; fi
          if [ "$TOTAL" -gt 0 ] && [ $((MISSING*2)) -gt "$TOTAL" ]; then FAIL="${FAIL}missing outcome.json $MISSING > 50% of $TOTAL; "; fi
          if [ -n "$FAIL" ]; then
            echo "::error title=systemic run failure::$FAIL"
            exit 1
          fi
          echo "OK: run not systemically broken — per-task INFRA/misses are best-effort (green)"
