name: "GT substrate image — build + push (one image, runs in any eval container)"

# Builds docker/Dockerfile.gt-substrate and pushes it to GHCR. The Dockerfile runs a
# build-time self-test (gt-index + onnxruntime + pyright + e5 all present and runnable
# on glibc 2.31), so a substrate with a missing library CANNOT be published. Built
# once, cached; the eval pipeline copies /opt/gt out of this image into the eval
# container and runs the whole substrate there (no per-job pip-install, no host split).
#
# Manual dispatch only — nothing auto-runs.

on:
  workflow_dispatch: {}
  push:
    branches: [gt-trial]
    paths:
      - "docker/Dockerfile.gt-substrate"
      - "docker/gt-substrate-run.sh"
      - ".github/workflows/gt_substrate_image.yml"
      # The substrate BAKES the GT python src (rerank/localization/brief/delivery run
      # INSIDE gt-run-proof), so a change to that src MUST rebuild the image to take
      # effect — without these, src fixes (e.g. the 2026-06-10 rerank fixes) silently
      # never reach the pinned digest. (latent-bug fix)
      - "src/groundtruth/**"
      - "benchmarks/swebench/gt_intel.py"
      - "scripts/swebench/gt_run_proof.py"
      - "scripts/metrics/**"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push GT substrate image (build-time self-test gates it)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gt-substrate
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gt-substrate:latest
            ghcr.io/${{ github.repository_owner }}/gt-substrate:${{ github.sha }}
          # RC-17 build stamp: gt-index embeds this commit via -X main.commitSHA so the
          # baked binary never prints "Commit/Toolchain: unknown" (preflight provenance).
          build-args: |
            GT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the published image's closure runs on glibc 2.31
        run: |
          set -euo pipefail
          docker run --rm "ghcr.io/${{ github.repository_owner }}/gt-substrate@${{ steps.build.outputs.digest }}" bash -lc '
            set -euo pipefail   # STRICT: the closure MUST fail on the first missing dependency (no silent mask)
            gt-index -h >/dev/null 2>&1 && echo "gt-index ok"
            /opt/gt/python/bin/python3 -c "import onnxruntime,numpy,pydantic,tokenizers; print(\"py ok\")"
            pyright --version
            typescript-language-server --version
            # AT-EDIT CHECKER CLOSURE (2026-07-24). The two runtime checkers below were previously
            # UNVERIFIED by this gate, so a substrate that could not run them would publish clean and
            # go silently dark in production — the exact failure mode that made GT_EDIT_CHECK_NAMES
            # unprovable. Both are now part of the STRICT closure: missing => the image is not published.
            #   * pyflakes backs edit_check._check_py_undefined_names (name_error verdicts).
            #   * the TS/TSX/JSX probe requires the typescript MODULE (not the language server) and
            #     falls back to this EXACT path when the repo has no node_modules of its own, so the
            #     path is asserted literally rather than via a bare `require(\"typescript\")`.
            /opt/gt/python/bin/python3 -c "import pyflakes; print(\"pyflakes ok\", pyflakes.__version__)"
            echo "--- typescript module location(s) actually present in this image ---"
            find /opt/gt /usr/lib /usr/local/lib -maxdepth 6 -type d -name typescript 2>/dev/null | head -5 || true
            /opt/gt/python/bin/python3 -c "import sys,os,tempfile; sys.path.insert(0,\"/opt/gt/src\"); from groundtruth.runtime.edit_check import check_edit_syntax; d=tempfile.mkdtemp(); p=os.path.join(d,\"b.ts\"); open(p,\"w\").write(\"function f(a: number {\"); r=check_edit_syntax(p,d); print(\"TS at-edit probe ->\", r); assert r[\"verdict\"]==\"syntax_error\", \"TS at-edit checker is DARK in the published image (typescript module unresolvable from a repo with no node_modules)\""
            gopls version
            rust-analyzer --version
            # java/jdtls + e5-small-v2 were REMOVED 2026-06-20 (not in the benchmark/runtime contract) —
            # probing them here would either abort the truthful closure or silently pass a stale claim.
            test -s /opt/gt/models/gte-modernbert-base/model.onnx && echo "gte ok"
            # jina code embedder is a NON-FATAL A/B lever (its bake is || WARN) — probe + report, never abort.
            if test -s /opt/gt/models/jina-embeddings-v2-base-code/model.onnx; then JINA=present; else JINA=absent; fi
            /opt/gt/python/bin/python3 -c "import sys; sys.path.insert(0,\"/opt/gt/src\"); from groundtruth.memory.enrich.embed import get_embedding_model, _default_embed_model; print(\"default embedder:\", _default_embed_model()); m=get_embedding_model(); v=m.embed(\"x\", is_query=True); assert any(v) and len(v)==m.dim; print(\"embedder ok dim=\", m.dim)"
            printf "{\"languages\":{\"python\":\"available\",\"typescript\":\"available\",\"javascript\":\"available\",\"go\":\"available\",\"rust\":\"available\",\"java\":\"not_in_benchmark_contract\"},\"embedders\":{\"gte-modernbert-base\":\"functional\",\"jina-embeddings-v2-base-code\":\"%s\",\"e5-small-v2\":\"not_in_runtime_contract\"}}\n" "$JINA"
            echo "=== GT substrate image verified portable (LSP py/ts/go/rust; embedder gte-modernbert + jina-code[$JINA]) ==="'

      - name: Verify gt-run-proof portable entrypoint is baked (Stage 4.2)
        run: |
          docker run --rm "ghcr.io/${{ github.repository_owner }}/gt-substrate@${{ steps.build.outputs.digest }}" \
            gt-run-proof --print-contract | head -8

      - name: Capture immutable digest (the pinned proof input — NOT a mutable tag)
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          PINNED="ghcr.io/${{ github.repository_owner }}/gt-substrate@${DIGEST}"
          echo "GT_SUBSTRATE_DIGEST=$PINNED"
          { echo "## GT substrate pinned digest"; echo '```'; \
            echo "GT_SUBSTRATE_DIGEST=$PINNED"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/gt_digest && echo "$PINNED" > /tmp/gt_digest/GT_SUBSTRATE_DIGEST.txt

      - name: Upload pinned digest
        uses: actions/upload-artifact@v4
        with:
          name: gt-substrate-digest
          path: /tmp/gt_digest/GT_SUBSTRATE_DIGEST.txt
          if-no-files-found: warn

# dispatch registration nudge — enable workflow_dispatch on the default branch
